<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Олимпиадная разминка 6–10 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@500;800&display=swap">
<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{display:grid;gap:10px;max-width:68ch}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}

/* Макет: одна карточка-«стикер» на задачу, толстые контуры, крупные кнопки. Для детей 6–10 лет. */
:root{
  --bg:#E4F2FF;--surface:#FFFFFF;--surface2:#F1F8FF;--ink:#15304D;--muted:#486582;
  --edge:#15304D;--line:#BDD5EE;--line-strong:#7FA6CF;
  --accent:#FFC93C;--on-accent:#15304D;--accent2:#DB3F31;--on-accent2:#FFFFFF;
  --good:#0C7A4D;--good-bg:#DDF6E8;--bad:#C22B2B;--bad-bg:#FDE4E1;--star:#FFC93C;
  --field:#FFFFFF;--hint-bg:#FFF2C2;--hint-edge:#D9A700;--code-inline:#DCEAF8;--focus:#1B62E0;
  --card-shadow:5px 6px 0 var(--edge);
  --radius:14px;--radius-lg:24px;--bw:3px;--bw-thin:2px;--lift:4px;--fs:19px;--maxw:880px;
  --f-display:'Rubik','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D2137;--surface:#16314E;--surface2:#1B3A5A;--ink:#EAF3FC;--muted:#A9C2DA;
  --edge:#9CC4F0;--line:#2B5379;--line-strong:#4C7BAA;
  --accent:#FFC93C;--on-accent:#15304D;--accent2:#FF7A6B;--on-accent2:#2B0B08;
  --good:#52D597;--good-bg:#12392B;--bad:#FF9088;--bad-bg:#47222B;--star:#FFC93C;
  --field:#0D2137;--hint-bg:#3A3413;--hint-edge:#C9A227;--code-inline:#25486F;--focus:#7DB2FF;
  --card-shadow:5px 6px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D2137;--surface:#16314E;--surface2:#1B3A5A;--ink:#EAF3FC;--muted:#A9C2DA;
  --edge:#9CC4F0;--line:#2B5379;--line-strong:#4C7BAA;
  --accent:#FFC93C;--on-accent:#15304D;--accent2:#FF7A6B;--on-accent2:#2B0B08;
  --good:#52D597;--good-bg:#12392B;--bad:#FF9088;--bad-bg:#47222B;--star:#FFC93C;
  --field:#0D2137;--hint-bg:#3A3413;--hint-edge:#C9A227;--code-inline:#25486F;--focus:#7DB2FF;
  --card-shadow:5px 6px 0 rgba(0,0,0,.4);color-scheme:dark}

body{font-weight:600}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.intro p+p{margin-top:6px}

/* задача 1 */
.seq{display:flex;flex-wrap:wrap;gap:10px}
.sc{display:grid;gap:4px;justify-items:center;width:clamp(58px,16.5vw,82px)}
.sc .n{width:100%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.45rem;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface);padding:.3em 0}
.sc.q .n{background:var(--accent);color:var(--on-accent)}
.sc .t{font-family:var(--f-mono);font-size:.74rem;text-align:center;line-height:1.35;color:var(--muted);font-weight:700}
.sc .t.ok{color:var(--good)}.sc .t.bad{color:var(--bad)}
.rule-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:800}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* задача 2 */
.mg{display:grid;gap:10px}
.mg .q{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);padding:.55em .8em}
.slot{min-width:84px;height:54px;padding:0 .6em;border:var(--bw) dashed var(--edge);border-radius:var(--radius);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem;cursor:pointer;background:var(--surface2);color:var(--muted)}
.slot.filled{border-style:solid;background:var(--accent);color:var(--on-accent)}
.slot.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.slot.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.mg .why{grid-column:1/-1;color:var(--bad);font-size:.9em;font-weight:700}
.pool{display:flex;gap:10px;flex-wrap:wrap;min-height:58px;align-items:center}
.chipn{cursor:pointer;min-width:72px;height:54px;padding:0 .8em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:1.35rem;box-shadow:0 var(--lift) 0 var(--edge)}
.chipn.sel{outline:4px solid var(--focus);transform:translateY(-4px)}

/* задача 3 */
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:440px;margin-inline:auto;width:100%}
.nav .cell{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1.05rem,5.2vw,1.6rem);border:var(--bw-thin) solid var(--line-strong);border-radius:10px;background:var(--surface);cursor:pointer;padding:0;color:var(--ink);transition:background .15s}
.nav .cell:hover{background:var(--surface2)}
.nav .cell.center{background:var(--accent);border:var(--bw) solid var(--edge);cursor:default;color:var(--on-accent)}
.nav .cell.center svg{width:70%;height:70%}
.nav .cell.trail{background:var(--hint-bg);border-color:var(--hint-edge)}
.nav .cell.hit{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.nav .cell.bad{animation:shake .35s}
.mv{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mvc{display:flex;align-items:center;gap:5px;border:var(--bw-thin) solid var(--line-strong);border-radius:10px;background:var(--surface);padding:.1em .55em;font-weight:800;min-width:62px;justify-content:center}
.mvc .k{display:grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.8em}
.mvc .ar{font-size:1.6rem;line-height:1.2;font-family:'DejaVu Sans',system-ui,sans-serif}
.mvc.cur{border-color:var(--edge);background:var(--accent);color:var(--on-accent);transform:scale(1.12);z-index:1}
.mvc.cur .k{background:var(--edge);color:var(--surface)}
.mvc.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.mvc.done .k{background:var(--good);color:var(--surface)}
.ans{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;row-gap:10px}
.al{width:1.75em;height:2.1em;border-bottom:4px solid var(--edge);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.al.sp{width:.9em;border-bottom:0}
.al.new{animation:pop .3s}
.cipher-out{display:grid;gap:10px}

</style>
<div id="app"></div>
<script>
window.PAGE_ID = 'a';
/* ===== общее ядро: помощники, оболочка задания, навигация ===== */
const K = (function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function s(tag, props, ...kids) {
    const el = document.createElementNS(NS, tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) { if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return el;
  }

  const PAGE = () => window.PAGE_ID || 'p';
  const Store = {
    get(k, d) { try { const v = localStorage.getItem('olymp:' + PAGE() + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('olymp:' + PAGE() + ':' + k, JSON.stringify(v)); } catch (e) { /* хранилище может быть недоступно */ } }
  };

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const onEnter = (el, fn) => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
  const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function burst(anchor) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = anchor ? anchor.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = ['--accent', '--accent2', '--good', '--star'];
    for (let i = 0; i < 26; i++) {
      const c = h('i', { class: 'confetti' });
      c.style.left = cx + 'px'; c.style.top = cy + 'px';
      c.style.background = 'var(' + cols[i % cols.length] + ')';
      document.body.append(c);
      const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 140;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 60;
      const anim = c.animate ? c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy + 140}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }) : null;
      if (anim) anim.onfinish = () => c.remove(); else c.remove();
    }
  }

  function mascot(mood) {
    mood = mood || 'happy';
    const mouths = { happy: 'M24 42 Q32 49 40 42', think: 'M25 44 H39', wow: 'M32 41 m-3.5 0 a3.5 4.5 0 1 0 7 0 a3.5 4.5 0 1 0 -7 0' };
    const st = { stroke: 'var(--edge)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    return s('svg', { viewBox: '0 0 64 62', class: 'mascot', 'aria-hidden': 'true' },
      s('line', { x1: 32, y1: 4, x2: 32, y2: 13, ...st }),
      s('circle', { cx: 32, cy: 5, r: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 3, y: 28, width: 8, height: 15, rx: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 53, y: 28, width: 8, height: 15, rx: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 9, y: 13, width: 46, height: 44, rx: 15, fill: 'var(--accent)', ...st }),
      s('rect', { x: 15, y: 21, width: 34, height: 28, rx: 10, fill: 'var(--surface)', ...st, 'stroke-width': 2.4 }),
      s('circle', { cx: 25, cy: 32, r: 3.4, fill: 'var(--edge)' }),
      s('circle', { cx: 39, cy: 32, r: 3.4, fill: 'var(--edge)' }),
      s('path', { d: mouths[mood], fill: mood === 'wow' ? 'var(--edge)' : 'none', ...st, 'stroke-width': 2.6 })
    );
  }

  function stepper(min, max, val, onChange, fmt) {
    let v = val;
    const out = h('output', { 'aria-live': 'polite' });
    const draw = () => { out.textContent = fmt ? fmt(v) : String(v); };
    const mk = (label, d, sign) => h('button', { type: 'button', 'aria-label': label, onclick: () => { const nv = Math.max(min, Math.min(max, v + d)); if (nv !== v) { v = nv; draw(); onChange(v); } } }, sign);
    draw();
    const el = h('span', { class: 'stepper' }, mk('меньше', -1, '−'), out, mk('больше', 1, '+'));
    el.get = () => v; el.set = (n) => { v = n; draw(); };
    return el;
  }

  /* ---------- оболочка задания ---------- */
  const app = { tasks: [], tabs: [], show: null };

  function Task(cfg) {
    const st = { solved: false, attempts: 0, hints: 0, shown: false };
    const fb = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
    const play = h('div', { class: 'play' });
    const hintsBox = h('div', { class: 'hints' });
    const explainBox = h('div');
    const nextBox = h('div');
    const hintBtn = h('button', { class: 'btn sm', type: 'button' });
    const revealBtn = h('button', { class: 'btn sm ghost', type: 'button' }, 'Показать разбор');
    revealBtn.hidden = true;
    const hints = cfg.hints || [];
    const upd = () => {
      hintBtn.textContent = st.hints < hints.length ? `Подсказка (${st.hints}/${hints.length})` : 'Подсказки закончились';
      hintBtn.disabled = st.hints >= hints.length;
      hintBtn.hidden = !hints.length;
      revealBtn.hidden = st.solved || st.shown || !(st.hints >= 2 || st.attempts >= 3);
    };
    hintBtn.onclick = () => {

    hints: [
      'Цифра в кружочке — сколько клеток нужно пройти. Стрелка показывает направление, в том числе по диагонали.',
      'Каждую карточку начинай заново от жёлтой клетки с звездой, а не с того места, где ты остановился.',
      'Если запутался, нажми «Покажи счёт»: я пройду путь клетка за клеткой.'
    ],
    build(play, api) {
      let idx = 0, busy = false;
      const letters = [];
      const grid = h('div', { class: 'nav', role: 'group', 'aria-label': 'Поле 7 на 7' });
      const cells = G.map((row, r) => row.map((ch, c) => {
        const center = r === 3 && c === 3;
        const b = h('button', { type: 'button', class: 'cell' + (center ? ' center' : ''), 'aria-label': center ? 'Центр, старт' : `Строка ${r + 1}, столбец ${c + 1}, буква ${ch}`, onclick: () => onCell(r, c) }, center ? starSvg() : ch);
        grid.append(b); return b;
      }));
      const strip = h('div', { class: 'mv', 'aria-label': 'Карточки движения' });
      const ans = h('div', { class: 'ans', 'aria-live': 'polite', 'aria-label': 'Собранная фраза' });
      const hintBtn = h('button', { class: 'btn sm', type: 'button', onclick: () => showCount() }, 'Покажи счёт');
      function drawStrip() { strip.replaceChildren(...MOVES.map((m, i) => moveCard(m, i < idx ? 'done' : i === idx ? 'cur' : ''))); }
      function drawAns(newIdx) {
        const out = [];
        for (let i = 0; i < MOVES.length; i++) {
          if (i === 11) out.push(h('span', { class: 'al sp' }));
          out.push(h('span', { class: 'al' + (i === newIdx ? ' new' : '') }, letters[i] || ''));
        }
        ans.replaceChildren(...out);
      }
      function clear() { cells.flat().forEach(c => c.classList.remove('trail', 'hit', 'bad')); }
      function path(m) { const p = []; for (let i = 1; i <= m[0]; i++) p.push([3 + DIRS[m[1]][0] * i, 3 + DIRS[m[1]][1] * i]); return p; }
      async function showCount() {
        if (busy || idx >= MOVES.length) return; busy = true; clear();
        const m = MOVES[idx], p = path(m);
        for (let i = 0; i < p.length; i++) { const el = cells[p[i][0]][p[i][1]]; el.classList.add('trail'); api.say(['Раз…', 'Два…', 'Три…'][i], 'info'); await sleep(650); }
        api.say(`Остановись на ${p.length}-й клетке и нажми на неё.`, 'info'); busy = false;
      }
      async function onCell(r, c) {
        if (busy || idx >= MOVES.length) return;
        const m = MOVES[idx], [tr, tc] = target(m);
        clear();
        if (r === tr && c === tc) {
          busy = true;
          const p = path(m);
          for (let i = 0; i < p.length - 1; i++) { cells[p[i][0]][p[i][1]].classList.add('trail'); await sleep(140); }
          cells[tr][tc].classList.add('hit');
          letters[idx] = G[tr][tc]; const was = idx; idx++;
          drawStrip(); drawAns(was);
          busy = false;
          if (idx >= MOVES.length) { api.solve('Получилось: ЭЛЕКТРОННАЯ КНИГА!', ans); cells.forEach(r => r.forEach(x => x.classList.remove('hit'))); }
          else api.say(`Верно! Буква «${G[tr][tc]}». Следующая карточка.`, 'ok');
        } else {
          api.attempt();
          cells[r][c].classList.add('bad');
          const dr = r - 3, dc = c - 3, d = DIRS[m[1]];
          let text;
          if (r === 3 && c === 3) text = 'Это старт. Отсюда нужно сделать шаги по стрелке.';
          else if (Math.sign(dr) === d[0] && Math.sign(dc) === d[1] && (Math.abs(dr) === Math.abs(dc) || dr === 0 || dc === 0)) text = 'Направление верное, но число клеток другое. Посчитай ещё раз.';
          else text = 'Это не в ту сторону. Посмотри на стрелку на карточке.';
          api.say(text, 'bad');
        }
      }
      drawStrip(); drawAns(-1);
      play.append(strip, grid, ans, h('div', { class: 'row' }, hintBtn));
      play.querySelector('.ans').style.marginTop = '4px';
    },
    explain: `<p>Каждую карточку мы начинали от центра и шли по стрелке столько клеток, сколько написано в кружочке. Буквы, на которых остановились, сложились в слова:</p>
      <p><b>ЭЛЕКТРОННАЯ КНИГА</b></p>
      <p>Так работают шифры-«маршруты»: чтобы прочитать сообщение, нужно знать <b>точку старта</b> и <b>правила движения</b>.</p>`,
    practice(box) {
      const input = h('input', { class: 'field', id: 'a3-word', type: 'text', maxlength: 12, placeholder: 'Например, КОТ', 'aria-label': 'Слово для шифра', style: { width: '12em' } });
      const out = h('div', { class: 'cipher-out' });
      const options = (ch) => { const r = []; for (let st = 1; st <= 3; st++) for (const d in DIRS) { const [rr, cc] = [3 + DIRS[d][0] * st, 3 + DIRS[d][1] * st]; if (G[rr][cc] === ch) r.push([st, d]); } return r; };
      const go = () => {
        const w = input.value.toUpperCase().replace(/Ё/g, 'Е').replace(/[^А-Я]/g, '');
        out.replaceChildren();
        if (!w) { out.append(h('p', { class: 'fb bad' }, 'Впиши слово русскими буквами.')); return; }
        const cards = [], miss = [];
        for (const ch of w) { const o = options(ch); if (o.length) cards.push(o[0]); else miss.push(ch); }
        if (miss.length) { out.append(h('p', { class: 'fb bad' }, `Этих букв нет на «лучах» от центра: ${[...new Set(miss)].join(', ')}. Попробуй другое слово.`)); return; }
        out.append(h('p', { class: 'fb ok' }, `Шифр для слова «${w}»:`), h('div', { class: 'mv' }, cards.map(c => moveCard(c))), h('p', { class: 'muted small' }, 'Покажи эти карточки другу: пусть он расшифрует слово по сетке.'));
      };
      onEnter(input, go);
      box.append(h('p', null, 'Придумай свой шифр: впиши короткое слово, и я составлю карточки. Подойдут слова вроде КОТ, ДОМ, МАМА, ЛИМОН, ГОРА.'), h('div', { class: 'answer-row' }, input, h('button', { class: 'btn primary', type: 'button', onclick: go }, 'Зашифровать')), out);
    }
  };

  K.App({
    title: 'Олимпиадная разминка',
    sub: 'Младшая группа, 6–10 лет · неделя 4',
    intro: '<p><b>Как работать.</b> Решай задачи по порядку. Если застрял, нажми «Подсказка», я помогу. Ошибаться можно: так мы и учимся.</p>',
    tasks: [task1, task2, task3]
  });
})();

</script>
