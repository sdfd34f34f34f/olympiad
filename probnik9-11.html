<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Банк к олимпиаде 9–11 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>

/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{max-width:68ch}
.story>*+*{margin-top:10px}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}


/* Макет: тетрадь в клетку, строгие контуры без теней, акцент бирюзовый и оранжевый. Лаборатория логики для 9–11 лет. */
:root{
  --bg:#EAF4F1;--surface:#FFFFFF;--surface2:#F2F9F7;--ink:#0F2F2A;--muted:#44625C;
  --edge:#0F2F2A;--line:#C6DDD7;--line-strong:#86B3A9;--grid:rgba(15,80,70,.07);
  --accent:#0B7E6F;--on-accent:#FFFFFF;--accent2:#F26B21;--on-accent2:#1A0A00;
  --good:#18803C;--good-bg:#DFF4E4;--bad:#BF3520;--bad-bg:#FCE7E1;--star:#F5B21B;
  --field:#FFFFFF;--hint-bg:#FFF0DB;--hint-edge:#EBA45E;--code-inline:#DDEDE9;--focus:#1B62E0;
  --s1:#F26B21;--s2:#0B7E6F;--s3:#3C6FD8;--s4:#E5A50A;
  --sock-b:#2F6FE0;--sock-g:#2EA44F;--sock-r:#D93A30;
  --card-shadow:none;
  --radius:10px;--radius-lg:16px;--bw:2px;--bw-thin:1.5px;--lift:0px;--fs:17px;--maxw:900px;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1B19;--surface:#112826;--surface2:#16322F;--ink:#E4F3EF;--muted:#93B6AE;
  --edge:#6FCDBC;--line:#244843;--line-strong:#3F7A70;--grid:rgba(120,220,200,.06);
  --accent:#2BC4AD;--on-accent:#04201C;--accent2:#FF8A4C;--on-accent2:#1A0A00;
  --good:#63DC8B;--good-bg:#12351F;--bad:#FF917D;--bad-bg:#44201A;--star:#F5B21B;
  --field:#0A1B19;--hint-bg:#3A2A14;--hint-edge:#B87A3C;--code-inline:#1F4A44;--focus:#7DB2FF;
  --s1:#FF8A4C;--s2:#2BC4AD;--s3:#7FA3FF;--s4:#F2BC2D;
  --sock-b:#5B93FF;--sock-g:#4CC56C;--sock-r:#FF6A5E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1B19;--surface:#112826;--surface2:#16322F;--ink:#E4F3EF;--muted:#93B6AE;
  --edge:#6FCDBC;--line:#244843;--line-strong:#3F7A70;--grid:rgba(120,220,200,.06);
  --accent:#2BC4AD;--on-accent:#04201C;--accent2:#FF8A4C;--on-accent2:#1A0A00;
  --good:#63DC8B;--good-bg:#12351F;--bad:#FF917D;--bad-bg:#44201A;--star:#F5B21B;
  --field:#0A1B19;--hint-bg:#3A2A14;--hint-edge:#B87A3C;--code-inline:#1F4A44;--focus:#7DB2FF;
  --s1:#FF8A4C;--s2:#2BC4AD;--s3:#7FA3FF;--s4:#F2BC2D;
  --sock-b:#5B93FF;--sock-g:#4CC56C;--sock-r:#FF6A5E;color-scheme:dark}

body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.top h1{font-size:clamp(1.15rem,4.6vw,1.8rem);font-weight:700}
.task-head h2{font-size:clamp(1.05rem,3.9vw,1.4rem);font-weight:700}
.num{border-radius:8px}
.tab{border-radius:8px}
.intro{border-color:var(--hint-edge);background:var(--hint-bg)}
.btn.primary{border-color:var(--accent)}
.bubble .mascot{display:none}


/* ===== банк задач: общая часть ===== */
.practice-wrap{display:grid;gap:14px;min-width:0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:8px}
.chip{cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:.4em .7em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface);font-weight:700;font-size:.9em;line-height:1.15}
.chip .cn{flex:none;display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--surface2);border:var(--bw-thin) solid var(--line-strong);font-family:var(--f-mono);font-size:.85em}
.chip .ct{min-width:0;overflow-wrap:anywhere}
.chip[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.chip[aria-selected="true"] .cn{background:var(--accent2);color:var(--on-accent2);border-color:var(--accent2)}
.chip.done .cn{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.done .cn::after{content:"✓"}
.chip.done .cn{font-size:0}
.chip.done .cn::after{font-size:.95rem}
.chip.done[aria-selected="true"] .cn{background:var(--accent2);color:var(--on-accent2)}
.ansrow{align-items:flex-start}
.ansrow.col{flex-direction:column;align-items:flex-start}
.ansrow.col .inw{width:100%;max-width:420px}
.inw{min-width:0;max-width:100%}
.inw .row{gap:12px}
.lab{display:flex;gap:8px;align-items:center}
.field.fnum{width:7.5em;font-weight:800;font-family:var(--f-mono)}
.field,input.field,textarea.field{color:var(--ink);caret-color:var(--ink);-webkit-text-fill-color:var(--ink)}
.field::placeholder{color:var(--muted);opacity:1;-webkit-text-fill-color:var(--muted)}
.field:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 100px var(--field) inset}
.tf-opt{color:var(--ink)}
.field.txt{width:min(18em,100%)}
.badge-cnt{font-weight:800;font-size:.85em;color:var(--good);border:var(--bw-thin) solid var(--good);border-radius:999px;padding:.1em .7em;white-space:nowrap}
.badge-cnt:empty{display:none}
.sub-h{font-family:var(--f-mono);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.task-head h2{overflow-wrap:anywhere}
.story table{border-collapse:collapse;max-width:100%}
.story table th,.story table td{border:var(--bw-thin) solid var(--line-strong);padding:.3em .55em;text-align:center}
.story svg{max-width:100%;height:auto}
.story .pre{font-family:var(--f-mono);white-space:pre-wrap;background:var(--code-inline);border-radius:var(--radius);padding:.6em .8em;display:block;overflow-x:auto}
.story ul,.story ol{margin:.2em 0;padding-left:1.3em}
.story .cl{margin:.2em 0;padding-left:1.3em}
.story .big{font-size:1.5em;line-height:1.3;letter-spacing:.08em}
.story .gridw{overflow-x:auto;max-width:100%}
.story .gr{display:inline-grid;gap:3px}
.story .gc{display:grid;place-items:center;width:clamp(30px,9.4vw,46px);height:clamp(30px,9.4vw,46px);border:var(--bw-thin) solid var(--line-strong);border-radius:6px;background:var(--surface);font-weight:800;font-family:var(--f-mono)}
.story .gc.w{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.story .gc.s{background:var(--accent2);color:var(--on-accent2)}
.story .gc.e{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.story .gc.q{background:var(--hint-bg);border-color:var(--hint-edge)}
.explain p{margin:0}
.explain code{font-family:var(--f-mono)}

/* ===== пробный вариант ===== */
.variant{display:grid;gap:16px;min-width:0}
.rules{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:68ch}
.tf-test,.tf-res{display:grid;gap:14px;min-width:0}
.tf-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius);padding:6px 12px}
.tf-clock{font-weight:800;font-size:1.15em;white-space:nowrap;font-family:var(--f-mono)}
.tf-bar.warn{border-color:var(--bad)}
.tf-bar.warn .tf-clock{color:var(--bad)}
.tf-prog{color:var(--muted);font-weight:700;font-size:.9em}
.tf-dots{display:flex;gap:6px;flex-wrap:wrap}
.tf-dot{cursor:pointer;min-width:44px;min-height:44px;border-radius:var(--radius);border:var(--bw-thin) solid var(--line-strong);background:var(--surface);font-weight:800;font-family:var(--f-mono)}
.tf-dot.ans{background:var(--hint-bg);border-color:var(--edge)}
.tf-dot.ans::after{content:"✓";font-size:.7em;margin-left:2px}
.tf-dot[aria-current="step"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tf-card{scroll-margin-top:80px}
.tf-pts{flex:none;font-weight:800;font-size:.85em;color:var(--muted);border:var(--bw-thin) solid var(--line-strong);border-radius:999px;padding:.1em .7em;white-space:nowrap}
.tf-nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.tf-confirm p{margin-bottom:10px;font-weight:700}
.tf-opts{display:grid;gap:8px}
.tf-opt{cursor:pointer;text-align:left;min-height:44px;padding:.55em 1em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface);font-weight:700}
.tf-opt::before{content:"○ ";font-weight:800}
.tf-opt[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.tf-opt[aria-checked="true"]::before{content:"● "}
.tf-score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tf-big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1.05}
.tf-skills{display:grid;gap:12px}
.tf-skill{display:grid;grid-template-columns:minmax(8em,12em) 1fr auto;gap:6px 12px;align-items:center}
.tf-sn{font-weight:800}
.tf-sv{font-weight:700;font-size:.9em;white-space:nowrap}
.tf-meter{display:block;height:16px;border:var(--bw-thin) solid var(--edge);border-radius:999px;background:var(--surface2);overflow:hidden}
.tf-meter i{display:block;height:100%;background:var(--good)}
.tf-skill.mid .tf-meter i{background:var(--accent2)}
.tf-skill.lo .tf-meter i{background:var(--bad)}
@media (max-width:560px){.tf-skill{grid-template-columns:1fr auto}.tf-meter{grid-column:1/-1;order:3}}
.tf-revs{display:grid;gap:8px}
.tf-rev{border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);background:var(--surface);min-width:0}
.tf-rev>summary{cursor:pointer;display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:center;padding:.6em .8em;min-height:44px;list-style:none}
.tf-rev>summary::-webkit-details-marker{display:none}
.tf-mk{font-weight:800;text-align:center}
.tf-rev.ok .tf-mk{color:var(--good)}
.tf-rev.bad .tf-mk{color:var(--bad)}
.tf-rt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.tf-rs{font-size:.85em;color:var(--muted);font-weight:700;white-space:nowrap}
.tf-revbody{display:grid;gap:10px;padding:0 .8em .8em;min-width:0}
@media (max-width:420px){.tf-rev>summary{grid-template-columns:1.6em 1fr}.tf-rs{grid-column:2}}

</style>

      const pos = R.shuffle([0, 1, 2, 3, 4]); /* pos[e] = день события e */
      const pool = [];

        for (let b = 0; b < 5; b++) if (a !== b) {

  function dagSvg(layers, edges, lab) {
    const id = 'ah' + (++uid); const colW = 78, rowH = 54, pad = 28;
    const maxN = Math.max(...layers.map(l => l.length)), W = pad * 2 + colW * (layers.length - 1) + 40, Hh = pad * 2 + rowH * (maxN - 1) + 30;
    const pos = {}; layers.forEach((l, i) => l.forEach((n, j) => { pos[n] = [pad + 20 + i * colW, Hh / 2 + (j - (l.length - 1) / 2) * rowH]; }));
    const ed = edges.map(([a, b]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b]; const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); const r = 15; return `<line x1="${x1 + dx / L * r}" y1="${y1 + dy / L * r}" x2="${x2 - dx / L * (r + 3)}" y2="${y2 - dy / L * (r + 3)}" stroke="currentColor" stroke-width="2" marker-end="url(#${id})"/>`; }).join('');
    const nd = Object.keys(pos).map(n => `<circle cx="${pos[n][0]}" cy="${pos[n][1]}" r="15" style="fill:var(--surface)" stroke="currentColor" stroke-width="2"/><text x="${pos[n][0]}" y="${pos[n][1] + 5}" text-anchor="middle" font-size="${lab[n].length > 2 ? 9 : 14}" font-weight="800" fill="currentColor">${lab[n]}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" role="img" aria-label="Схема маршрутов со стрелками" style="max-width:100%;height:auto"><defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${ed}${nd}</svg>`;
  }
  const D_PATHS = {
    id: 'paths', title: 'Маршруты через станцию', topic: 'Комбинаторика', pts: 3,

        const sizes = [R.int(2, 3), R.int(2, 3), R.int(2, 3)]; let nid = 1; const layers = [['S']];
        sizes.forEach(s => { const l = []; for (let i = 0; i < s; i++) l.push('n' + (nid++)); layers.push(l); }); layers.push(['T']);
        const edges = [];
        for (let i = 0; i < layers.length - 1; i++) { for (const a of layers[i]) for (const b of layers[i + 1]) if (R.chance(.62)) edges.push([a, b]); }
        const outs = {}, ins = {}; edges.forEach(([a, b]) => { (outs[a] = outs[a] || []).push(b); (ins[b] = ins[b] || []).push(a); });
        if (layers.slice(0, -1).some(l => l.some(n => !outs[n])) || layers.slice(1).some(l => l.some(n => !ins[n]))) continue;
        const from = {}, to = {}; from.S = 1; for (let i = 1; i < layers.length; i++) layers[i].forEach(n => { from[n] = (ins[n] || []).reduce((a, p) => a + from[p], 0); });
        to.T = 1; for (let i = layers.length - 2; i >= 0; i--) layers[i].forEach(n => { to[n] = (outs[n] || []).reduce((a, p) => a + to[p], 0); });
        const total = from.T; const mids = layers.slice(1, -1).flat(); const X = R.pick(mids); const ans = from[X] * to[X];

  /* ---------- 12. Двоичная система ---------- */
  const D_BIN = {
    id: 'binary', title: 'Двоичная система', topic: 'Информатика', pts: 2,
    make(R) {
      const t = R.int(0, 3);
      if (t === 0) { const n = R.int(9, 63); const b = n.toString(2); return { input: 'num', ans: n, html: P(`Переведи двоичное число <b>${b}</b> в десятичную систему.`), hints: ['Каждая цифра двоичного числа умножается на степень двойки: справа налево 1, 2, 4, 8, 16, …', 'Выпиши степени двойки под цифрами числа.', 'Складывай степени только там, где стоит 1.', 'Проверь сумму ещё раз.'], explain: P(`${b.split('').map((d, i) => d === '1' ? Math.pow(2, b.length - 1 - i) : null).filter(x => x != null).join(' + ')} = <b>${n}</b>.`) }; }
      if (t === 1) { const n = R.int(10, 63); const b = n.toString(2); return { input: 'text', ans: b, ph: 'двоичное число', canon: (s) => String(s).replace(/\s/g, ''), html: P(`Запиши число <b>${n}</b> в двоичной системе.`), hints: ['Раздели число на 2 и запиши остаток. Потом раздели частное на 2.', 'Повторяй, пока частное не станет 0.', 'Остатки, прочитанные снизу вверх, и есть двоичное число.', 'Проверь: переведи ответ обратно в десятичную систему.'], explain: P(`Деление на 2 с остатками, прочитанными снизу вверх, даёт <b>${b}</b>.`) }; }
      if (t === 2) { const k = R.int(3, 7); return { input: 'num', ans: Math.pow(2, k), html: P(`Сколько разных чисел (в том числе с ведущими нулями) можно записать, используя ровно <b>${k}</b> двоичных ${pl(k, 'разряд', 'разряда', 'разрядов')}?`), hints: ['Один разряд — 2 варианта: 0 или 1.', 'Два разряда — 4 варианта: 00, 01, 10, 11.', 'Каждый новый разряд удваивает число вариантов.', `Удвой ${k} ${pl(k, 'раз', 'раза', 'раз')} подряд, начиная с 1.`], explain: P(`Число вариантов 2^${k} = <b>${Math.pow(2, k)}</b>.`) }; }
      const N = R.pick([8, 16, 32, 64, 100, 20, 50]); const q = Math.ceil(Math.log2(N));
      return { input: 'num', ans: q, html: P(`Загадано число от 1 до <b>${N}</b>. Каждым вопросом ты можешь спросить «Число больше k?» (ответ «да» или «нет»). Какого <b>наименьшего</b> числа вопросов хватит, чтобы точно угадать число при самой невезучей ситуации?`), hints: ['Хорошая стратегия: каждым вопросом делить варианты пополам.', `После одного вопроса останется не больше половины чисел.`, 'Сколько раз можно делить пополам, пока не останется одно число?', `Найди наименьшее k, при котором 2^k ≥ ${N}.`], explain: P(`2^${q} = ${Math.pow(2, q)} ≥ ${N}, а 2^${q - 1} = ${Math.pow(2, q - 1)} < ${N}. Нужно <b>${q}</b> ${pl(q, 'вопрос', 'вопроса', 'вопросов')}.`) };
    }
  };

  /* ---------- 13. Числовые ряды ---------- */
  const D_SEQ2 = {
    id: 'seq2', title: 'Сложный ряд', topic: 'Числа', pts: 2,
    make(R) {
      const kind = R.pick(['fibm', 'dbl', 'alt', 'sq']);
      let t = [], rule, hints;
      if (kind === 'fibm') { const c = R.int(1, 4); t = [R.int(3, 9), R.int(4, 12)]; for (let i = 0; i < 5; i++) t.push(t[i] + t[i + 1] - c); rule = `каждое число — сумма двух предыдущих минус ${c}`; hints = ['Сложи первые два числа ряда и сравни с третьим.', 'Сумма двух предыдущих чисел немного больше следующего. На сколько?', `Правило: сумма двух предыдущих минус ${c}.`, 'Примени правило к двум последним числам.']; }
      else if (kind === 'dbl') { const d = R.int(1, 4); t = [R.int(1, 5)]; for (let i = 0; i < 6; i++) t.push(t[i] * 2 + d); rule = `каждое число = предыдущее × 2 + ${d}`; hints = ['Разности чисел растут быстро, так что правило с умножением.', 'Попробуй умножить первое число на 2 и сравнить со вторым.', `Не хватает ${d}: правило «× 2 + ${d}».`, 'Примени правило к последнему числу.']; }
      else if (kind === 'alt') { const a = R.int(2, 5), b = R.int(2, 4); t = [R.int(1, 6)]; for (let i = 0; i < 6; i++) t.push(i % 2 === 0 ? t[i] + a : t[i] * b); rule = `по очереди: + ${a}, затем × ${b}`; hints = ['Правило чередуется.', `Первый шаг: прибавили ${a}. Второй: умножили.`, 'Определи, какой шаг был последним, и сделай следующий.', 'Выполни нужное действие над последним числом.']; }
      else { const a = R.int(1, 4); t = []; for (let i = 1; i <= 7; i++) t.push(i * i + a); rule = `числа вида n² + ${a}: ${a + 1}, ${4 + a}, …`; hints = ['Посмотри на разности: они растут.', 'Разности нечётные: 3, 5, 7, … Подсказка: это квадраты.', `Числа — это квадраты 1, 4, 9, 16, … плюс ${a}.`, 'Найди, какой по счёту квадрат нужен, и прибавь число.']; }
      const shown = t.slice(0, 6), ans = t[6];
      return { input: 'num', ans, html: P('Продолжи ряд чисел:') + `<p class="big"><b>${shown.join(', ')}, ?</b></p>`, hints, explain: P(`Правило: ${rule}.`) + P(`Ряд: ${t.join(', ')}. Ответ: <b>${ans}</b>.`) };
    }
  };

  /* ---------- 14. Магический квадрат ---------- */
  const LOSHU = [[2, 7, 6], [9, 5, 1], [4, 3, 8]];
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const D_MAGIC = {
    id: 'magic', title: 'Магический квадрат', topic: 'Числа', pts: 2,
    make(R) {
      const m = R.int(1, 4), a = R.int(0, 12); const S = 15 * m + 3 * a; const vals = LOSHU.flat().map(v => v * m + a);
      for (let g = 0; g < 400; g++) {
        const hid = new Set(R.shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, R.int(4, 5)));
        const known = vals.map((v, i) => hid.has(i) ? null : v); let ch = true;
        while (ch) { ch = false; for (const L of LINES) { const un = L.filter(i => known[i] == null); if (un.length === 1) { known[un[0]] = S - L.filter(i => i !== un[0]).reduce((x, i) => x + known[i], 0); ch = true; } } }
        if (known.some(x => x == null)) continue;
        const q = [...hid][0]; const shown = vals.map((v, i) => i === q ? '?' : hid.has(i) ? '·' : v);
        const grid = `<div class="gridw"><div class="gr" style="grid-template-columns:repeat(3,auto)">${shown.map(v => `<div class="gc${v === '?' ? ' q' : ''}" style="width:clamp(44px,13vw,64px);height:clamp(44px,13vw,64px)">${v === '·' ? '' : v}</div>`).join('')}</div></div>`;
        return {
          input: 'num', ans: vals[q], html: P(`В квадрате сумма чисел в каждой строке, в каждом столбце и на каждой диагонали равна <b>${S}</b>. Пустые клетки нужно заполнить, а в клетке со знаком «?» — найти число.`) + grid,
          hints: ['Найди строку, столбец или диагональ, где пустая только одна клетка.', `Эта клетка равна ${S} минус сумма двух других чисел линии.`, 'Заполни такие клетки и ищи новые линии с одной пустой клеткой.', 'Продолжай, пока не дойдёшь до клетки «?».'],
          explain: P(`Заполняя по очереди клетки, до которых «не хватает» одного числа в линии, получаем все числа. В клетке «?» стоит <b>${vals[q]}</b>.`)
        };
      }
      throw new Error('magic');
    }
  };

  /* ---------- 15. Квадраты и прямоугольники на сетке ---------- */
  const D_SQ = {
    id: 'squares', title: 'Фигуры на сетке', topic: 'Комбинаторика', pts: 2,
    make(R) {
      const n = R.int(3, 5), m = R.int(3, 5), rect = R.chance(.4);
      let cnt = 0;
      if (rect) { for (let x1 = 0; x1 <= m; x1++) for (let x2 = x1 + 1; x2 <= m; x2++) for (let y1 = 0; y1 <= n; y1++) for (let y2 = y1 + 1; y2 <= n; y2++) cnt++; }
      else { for (let k = 1; k <= Math.min(n, m); k++) cnt += (n - k + 1) * (m - k + 1); }
      const grid = `<div class="gridw"><div class="gr" style="grid-template-columns:repeat(${m},auto)">${Array.from({ length: n * m }, () => '<div class="gc"></div>').join('')}</div></div>`;
      return {
        input: 'num', ans: cnt, html: P(`Прямоугольник ${n} × ${m} клеток разграфлен на единичные клетки. Сколько на нём ${rect ? '<b>прямоугольников</b> (квадраты тоже считаются прямоугольниками)' : '<b>квадратов</b> любого размера'}? Стороны фигур идут по линиям сетки.`) + grid,
        hints: rect ? ['Прямоугольник определяется двумя вертикальными и двумя горизонтальными линиями сетки.', `Вертикальных линий ${m + 1}, горизонтальных ${n + 1}.`, 'Выбери любые две вертикальные и любые две горизонтальные линии.', `Число способов выбрать 2 линии из ${m + 1}: ${(m + 1) * m / 2}; из ${n + 1}: ${(n + 1) * n / 2}.`] : ['Считай квадраты по размеру: сначала 1 × 1, потом 2 × 2 и так далее.', 'Квадраты 1 × 1 — это просто все клетки.', 'Для квадрата k × k считай, сколько позиций у его левого верхнего угла.', `Позиций (${n} − k + 1) × (${m} − k + 1). Сложи по всем k.`],
        explain: rect ? P(`Выбираем две вертикальные линии из ${m + 1} и две горизонтальные из ${n + 1}: ${(m + 1) * m / 2} × ${(n + 1) * n / 2} = <b>${cnt}</b>.`) : P(`Размер 1: ${n * m}; ${Array.from({ length: Math.min(n, m) - 1 }, (_, i) => `размер ${i + 2}: ${(n - i - 1) * (m - i - 1)}`).join('; ')}. Всего <b>${cnt}</b>.`)
      };
    }
  };

  return [D_VENN, D_MAZE, D_HOUSE, D_SCHED, D_PYR, D_BB, D_TRAINS, D_PATHS, D_DIGITS, D_TRACE, D_STAIRS, D_BIN, D_SEQ2, D_MAGIC, D_SQ];
})();
const IDS_B = {
  v1: [['venn', 1], ['maze', 2], ['pyramid', 3], ['blackbox', 4], ['trains', 5], ['paths', 6], ['digits', 7], ['trace', 8], ['house', 9], ['binary', 10], ['seq2', 11], ['squares', 12]],
  v2: [['sched', 21], ['venn', 22], ['maze', 23], ['magic', 24], ['blackbox', 25], ['stairs', 26], ['pyramid', 27], ['trace', 28], ['digits', 29], ['trains', 30], ['house', 31], ['squares', 32]]
};



(function () {
  const defs = DEFS_B, byId = {}; defs.forEach(d => { byId[d.id] = d; });
  const mk = (id, title, minutes, list) => ({ id, title, minutes, picks: list.map(([i, seed]) => ({ def: byId[i], seed })) });
  window.__bank = BankLib.App({
    title: 'Банк задач к олимпиаде', sub: '9–11 лет · олимпиада 29 ноября',
    intro: '<p><b>Как пользоваться.</b> «Тренировка» — 15 тем из занятий (круги Эйлера, лабиринты, логические дома, шифры, маршруты, алгоритмы): каждый раз новая задача, подсказки идут по ступенькам, после решения есть разбор. «Пробный вариант» — 12 задач на 2 часа, как на олимпиаде: без подсказок, с таймером; результат и разбор появятся в конце.</p>',
    defs, variants: [mk('v1', 'Пробный вариант 1', 120, IDS_B.v1), mk('v2', 'Пробный вариант 2', 120, IDS_B.v2)]
  });
})();

</script>
