<title>Неделя 5 для 6–10 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{max-width:68ch}
.story>*+*{margin-top:10px}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}


/* Макет: яркий «игровой» стиль, толстые контуры, объёмные кнопки. Синий и жёлтый акценты. 6–10 лет. */
:root{
  --bg:#E8F0FF;--surface:#FFFFFF;--surface2:#F2F6FF;--ink:#1A2848;--muted:#4F5E80;
  --edge:#1A2848;--line:#CBD8F2;--line-strong:#8EA5D6;
  --accent:#2F6BFF;--on-accent:#FFFFFF;--accent2:#FFC21A;--on-accent2:#2A1E00;
  --good:#12803F;--good-bg:#DCF5E5;--bad:#C4372A;--bad-bg:#FDE7E3;--star:#FFC21A;
  --field:#FFFFFF;--hint-bg:#FFF4CC;--hint-edge:#E5B312;--code-inline:#E1E9FB;--focus:#2F6BFF;
  --card-shadow:0 6px 0 rgba(26,40,72,.16);
  --radius:16px;--radius-lg:26px;--bw:3px;--bw-thin:2px;--lift:4px;--fs:18px;--maxw:820px;
  --f-display:'Rubik','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}

.top h1{font-size:clamp(1.35rem,6vw,2.1rem);font-weight:800}
.task-head h2{font-weight:800}
.tab{font-family:var(--f-display);font-weight:700}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.stage{display:grid;gap:14px}

/* крест */
.cr{width:100%;max-width:340px;height:auto;display:block;margin-inline:auto}
.cr .sh{fill:var(--surface2);stroke:var(--edge);stroke-width:4;stroke-linejoin:round}
.cr text{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cr .q{fill:var(--accent)}
.cr .cn circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:3}
.cr .cn.hl circle{fill:var(--accent2);stroke:var(--edge)}
.cr .cn.hl text{fill:var(--on-accent2)}
.cr .sd.hl text{fill:var(--accent)}
.ops{display:flex;gap:10px;flex-wrap:wrap}
.ops .btn{min-width:56px;font-size:1.4em;font-family:var(--f-display);padding:.15em .6em}
.ops .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.eqs{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.eqs li{display:flex;gap:10px;align-items:center;padding:.5em .8em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.05em;flex-wrap:wrap}
.eqs li.ok{background:var(--good-bg);border-color:var(--good)}
.eqs li.bad{background:var(--bad-bg);border-color:var(--bad)}
.eqs li i{font-style:normal;margin-left:auto}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer-row .lbl{font-family:var(--f-display);font-weight:800}

/* блок-схема из слотов */
.sf{position:relative;max-width:430px;margin-inline:auto;width:100%;height:500px}
.sf .col{position:absolute;left:0;top:0;width:76%;height:100%}
.slot{position:absolute;left:0;width:100%;height:54px;display:grid;place-items:center;text-align:center;padding:2px 10px;cursor:pointer;background:var(--surface);border:var(--bw) dashed var(--line-strong);border-radius:12px;font-weight:700;font-size:.82rem;line-height:1.15;color:var(--ink);transition:background .15s}
.slot:hover{background:var(--surface2)}
.slot.full{border-style:solid;border-color:var(--edge);background:var(--surface2)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.slot.ok{border-color:var(--good);background:var(--good-bg)}
.slot.run{background:var(--accent2);color:var(--on-accent2);border-color:var(--edge);transform:scale(1.03)}
.slot .ph{color:var(--muted);font-weight:700}
.slot.dia{height:120px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0;background:var(--line-strong);padding:0}
.slot.dia>span{display:grid;place-items:center;width:calc(100% - 6px);height:calc(100% - 6px);margin:3px;background:var(--surface);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0 22%}
.slot.dia.full>span{background:var(--surface2)}
.slot.dia.bad{background:var(--bad)}.slot.dia.ok{background:var(--good)}.slot.dia.run{background:var(--accent2)}
.slot.dia.bad>span{background:var(--bad-bg)}.slot.dia.ok>span{background:var(--good-bg)}.slot.dia.run>span{background:var(--accent2)}
.slot.dia.full{background:var(--edge)}
.slot.dia{transform:none}
.arr{position:absolute;left:50%;width:0;height:22px;border-left:var(--bw) solid var(--edge);transform:translateX(-50%)}
.arr::after{content:"";position:absolute;left:-8px;bottom:-2px;border:7px solid transparent;border-top:9px solid var(--edge);border-bottom:0}
.sf .lbl2{position:absolute;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--muted)}
.loop{position:absolute;left:76%;width:17%;border:var(--bw) solid var(--edge);border-left:0;border-radius:0 14px 14px 0}
.loop::before{content:"";position:absolute;left:-2px;top:-8px;border:7px solid transparent;border-right:9px solid var(--edge);border-left:0}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipb{cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;padding:.4em .9em;border-radius:999px;border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge);min-height:44px}
.chipb[aria-pressed="true"]{background:var(--accent2);color:var(--on-accent2)}
.chipb:disabled{opacity:.35;box-shadow:none;cursor:default}
.plates{font-weight:800;font-family:var(--f-display)}

/* шифр */
.ciph{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tile{display:grid;place-items:center;width:clamp(36px,10.4vw,52px);height:clamp(44px,12vw,60px);border-radius:10px;border:var(--bw) solid var(--edge);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,5vw,1.6rem);position:relative}
.tile small{position:absolute;bottom:-1.4em;font-size:.55em;font-family:var(--f-body);color:var(--muted);font-weight:700}
.ciph{padding-bottom:1.4em}
.tile.hl{background:var(--accent2);color:var(--on-accent2)}
.tile.ltr{background:var(--surface2)}
.wcards{display:grid;gap:10px}
.wcard{cursor:pointer;text-align:left;display:grid;gap:6px;padding:.7em .9em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);box-shadow:0 var(--lift) 0 var(--edge);font:inherit;color:var(--ink)}
.wcard:hover{background:var(--surface2)}
.wcard .wd{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.wcard .letters{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:1.3em}
.wcard .letters .tile{width:clamp(30px,9vw,40px);height:clamp(36px,10vw,46px);font-size:1.05rem;border-width:2px}
.wcard .note{font-size:.85em;color:var(--muted);font-weight:700;min-height:1.2em}
.wcard.out{opacity:.45;background:var(--surface2)}
.wcard.out .wd{text-decoration:line-through}
.wcard.good{border-color:var(--good);background:var(--good-bg)}
.wcard.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lupe{display:flex;gap:10px;flex-wrap:wrap}

</style>

      'Ромб — это вопрос. Какое из действий — вопрос с ответом «да» или «нет»?',
      'Стрелка «да» ведёт к блоку номер 2 (под самым первым). Значит, «включи воду» стоит выше цикла и выполняется один раз.',
      'Внутри цикла по порядку: убрать мусор → нанести средство → помыть → спросить «есть ещё?».',
      'Последним, когда посуды больше нет, робот выключает воду.'
    ],
    build(play, api) {
      const w = slotFlow(DISH, api);
      const log = h('div', { class: 'box small', 'aria-live': 'polite', hidden: true });
      const runBtn = h('button', { class: 'btn', type: 'button', hidden: true, onclick: async () => { runBtn.disabled = true; log.hidden = false; await runRobot(w, log, 3); runBtn.disabled = false; } }, '▶ Запустить робота (3 тарелки)');
      play.append(w.sf, h('p', { class: 'sub-h', style: { fontFamily: 'var(--f-display)' } }, 'Действия:'), w.bank,
        h('div', { class: 'row', style: { justifyContent: 'center' } },
          h('button', { class: 'btn primary', type: 'button', onclick: () => { if (w.check()) { api.solve('Верно! Робот-посудомойка запрограммирован.'); runBtn.hidden = false; } } }, 'Проверить'),
          h('button', { class: 'btn ghost', type: 'button', onclick: () => { w.reset(); api.say('', 'info'); } }, 'Начать заново'), runBtn), log);
    },
    explain() {
      return h('div', null,
        h('ol', null, ...[6, 4, 2, 3, 5, 1].map(id => h('li', null, h('b', null, id + ') '), DISH.bank.find(b => b.id === id).text, id === 5 ? ' — ромб, ответ «да» ведёт наверх к блоку 4, ответ «нет» — вниз к блоку 1' : ''))),
        h('p', { class: 'small muted', html: 'Это <b>цикл</b>: робот повторяет «убрать мусор → средство → помыть», пока есть грязная посуда. Типичные ошибки: поставить «включи воду» внутрь цикла; поставить вопрос не в ромб; забыть, что воду выключают в самом конце.' }));
    },
    practiceTitle: 'Ещё потренироваться: другие роботы',
    practice(body) {
      const SC = [
        { name: 'Робот-садовник', ids: ['Возьми лейку', 'Налей воды в лейку', 'Полей грядку', 'Перейди к следующей грядке', 'Остались сухие грядки?', 'Убери лейку'],
          reasons: ['сначала берут лейку — без неё поливать нечем (один раз).', 'потом в лейку наливают воду.', 'затем поливают грядку.', 'после полива переходят к следующей грядке.', 'после этого проверяют: остались ли сухие грядки? Это вопрос — место ромба.', 'когда сухих грядок нет, лейку убирают.'] },
        { name: 'Робот-повар', ids: ['Достань хлеб и сыр', 'Отрежь ломтик хлеба', 'Положи на ломтик сыр', 'Положи бутерброд на тарелку', 'Остался хлеб?', 'Подай тарелку со всеми бутербродами'],
          reasons: ['сначала достают продукты (один раз).', 'потом отрезают ломтик хлеба.', 'на ломтик кладут сыр.', 'готовый бутерброд кладут на тарелку.', 'проверяют, остался ли хлеб: вопрос — место ромба.', 'когда хлеб закончился, подают все бутерброды.'] }
      ];
      SC.forEach(sc => {
        const bank = sc.ids.map((t, i) => ({ id: i + 1, text: t }));
        const f = h('p', { class: 'fb' });
        const api2 = { say: (m, k) => { f.className = 'fb ' + (k || 'info'); f.textContent = m; }, attempt() { } };
        const w = slotFlow({ bank, target: [1, 2, 3, 4, 5, 6], qId: 5, reasons: sc.reasons, numbered: false }, api2);
        body.append(h('div', { class: 'box' }, h('p', { class: 'sub-h', style: { fontFamily: 'var(--f-display)' } }, sc.name), w.sf, w.bank,
          h('div', { class: 'row', style: { justifyContent: 'center' } }, h('button', { class: 'btn primary', type: 'button', onclick: () => { if (w.check()) { f.className = 'fb ok'; f.textContent = 'Верно!'; K.burst(f); } } }, 'Проверить'), h('button', { class: 'btn ghost', type: 'button', onclick: () => { w.reset(); f.textContent = ''; } }, 'Заново')), f));
      });
    }
  };

  /* ================= Задача 3. Кодовое слово ================= */
  const pattern = (arr) => { const m = new Map(); return arr.map(x => { if (!m.has(x)) m.set(x, m.size); return m.get(x); }).join(','); };
  function whyNot(word, cipher) {
    const w = Array.from(word), c = Array.from(cipher);
    if (w.length !== c.length) return `В слове «${word}» ${w.length} ${K.plural(w.length, 'буква', 'буквы', 'букв')}, а в шифре ${c.length} ${K.plural(c.length, 'знак', 'знака', 'знаков')}. Не подходит.`;
    for (let i = 0; i < c.length; i++) for (let j = i + 1; j < c.length; j++) {
      if (c[i] === c[j] && w[i] !== w[j]) return `В шифре знаки на местах ${i + 1} и ${j + 1} одинаковые (${c[i]}), значит, и буквы должны быть одинаковые. В слове «${word}» там «${w[i]}» и «${w[j]}» — разные.`;
      if (c[i] !== c[j] && w[i] === w[j]) return `В шифре знаки на местах ${i + 1} и ${j + 1} разные, а в слове «${word}» на этих местах одна и та же буква «${w[i]}». Разные знаки — разные буквы.`;
    }
    return '';
  }
  function cipherWidget(cipher, options, answer, cb) {
    const cs = Array.from(cipher);
    const tiles = cs.map((ch, i) => h('div', { class: 'tile' }, ch, h('small', null, i + 1)));
    const pat = pattern(cs);
    const cards = options.map(word => {
      const letters = Array.from(word);
      const note = h('div', { class: 'note' });
      const lt = h('div', { class: 'letters' });
      const card = h('button', { class: 'wcard', type: 'button', onclick: () => pickWord(word, card) }, h('div', { class: 'wd' }, word), lt, note);
      lt.append(...letters.map((ch, i) => h('div', { class: 'tile' }, ch, h('small', null, i + 1))));
      return { word, letters, card, note, lt };
    });
    let counted = false, matched = false;
    const lupe1 = h('button', { class: 'btn', type: 'button', onclick: () => {
      counted = true; cards.forEach(c => { const ok = c.letters.length === cs.length; c.card.classList.toggle('out', !ok); c.note.textContent = `${c.letters.length} ${K.plural(c.letters.length, 'буква', 'буквы', 'букв')}${ok ? ' — как знаков' : ' ≠ ' + cs.length}`; });
      cb.say(`В шифре ${cs.length} ${K.plural(cs.length, 'знак', 'знака', 'знаков')}. Слова другой длины зачёркнуты.`, 'info');
    } }, '🔢 Посчитать буквы');
    const lupe2 = h('button', { class: 'btn', type: 'button', onclick: () => {
      matched = true;
      const reps = []; for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) if (cs[i] === cs[j]) reps.push([i, j]);
      tiles.forEach((t, i) => t.classList.toggle('hl', reps.some(r => r.includes(i))));
      cards.forEach(c => {
        c.lt.replaceChildren(...c.letters.map((ch, i) => h('div', { class: 'tile' + (reps.some(r => r.includes(i)) ? ' hl' : ''), style: { width: '' } }, ch, h('small', null, i + 1))));
        if (c.letters.length !== cs.length) { c.note.textContent = 'длина не подходит'; return; }
        const bad = whyNot(c.word, cipher);
        c.note.textContent = bad ? 'буквы на отмеченных местах не сходятся ✗' : 'всё сходится ✓';
      });
      cb.say(reps.length ? `Одинаковые знаки стоят на местах ${reps.map(r => r.map(x => x + 1).join(' и ')).join('; ')}. В нужном слове на этих местах — одинаковые буквы.` : 'В шифре нет одинаковых знаков — значит, в слове не должно быть повторяющихся букв.', 'info');
    } }, '🔍 Найти одинаковые знаки');
    function pickWord(word, card) {
      cards.forEach(c => c.card.classList.remove('wrong'));
      if (word === answer) { card.classList.add('good'); cb.ok(word); return; }
      card.classList.add('wrong'); cb.bad(whyNot(word, cipher) || 'Не подходит.');
    }
    return h('div', { class: 'stage' }, h('div', { class: 'ciph', role: 'img', 'aria-label': 'Шифр: ' + cs.join(' ') }, tiles),
      h('div', { class: 'lupe' }, lupe1, lupe2), h('div', { class: 'wcards' }, cards.map(c => c.card)));
  }
  const WORDS = ['монитор', 'ноутбук', 'принтер', 'сканер', 'модем', 'мышка', 'экран', 'диск', 'файл', 'папка', 'пароль', 'сервер', 'программа', 'робот', 'пиксель', 'сайт', 'браузер', 'значок', 'кнопка', 'символ', 'память', 'процессор', 'интернет', 'картинка', 'принтер', 'клавиши'];
  function genCipher() {
    for (let t = 0; t < 400; t++) {
      const target = pick(WORDS);
      const same = WORDS.filter(w => w !== target && w.length === target.length);
      if (!same.length) continue;
      const opts = [target, pick(same)];
      while (opts.length < 4) { const w = pick(WORDS); if (!opts.includes(w)) opts.push(w); }
      const tl = Array.from(target), pt = pattern(tl);
      const matching = opts.filter(w => w.length === target.length && pattern(Array.from(w)) === pt);
      if (matching.length !== 1) continue;
      const syms = shuffle(['@', '#', '$', '%', '&', '*', '№', '!', '?', '+', '=', '~', '§']);
      const map = new Map(); [...new Set(tl)].forEach((l, i) => map.set(l, syms[i]));
      return { cipher: tl.map(l => map.get(l)).join(''), options: shuffle(opts), answer: target };
    }
    return { cipher: '%#№@$#&', options: ['модем', 'монитор', 'ноутбук', 'принтер', 'сканер'], answer: 'монитор' };
  }

  const t3 = {
    id: 'code', num: 3, title: 'Кодовое слово',
    story: '<p>Какое слово здесь закодировано? Шифр нам неизвестен, но мы можем догадаться!</p><p class="mono" style="font-size:1.4em;font-weight:800;letter-spacing:.15em">%#№@$#&amp;</p><p class="muted">Воспользуйся лупами 🔢 и 🔍, потом нажми на слово, которое подходит.</p>',
    hints: [
      'Сколько знаков в шифре? Посчитай. Теперь посчитай буквы в каждом слове — нажми на лупу «Посчитать буквы».',
      'Какие слова не подходят по длине? Они зачеркнутся. Из оставшихся выбирай.',
      'Посмотри на шифр: один знак повторяется. На каких местах он стоит? Нажми «Найти одинаковые знаки».',
      'Если знаки одинаковые, то и буквы на этих местах должны быть одинаковыми. В каком слове на этих местах одна и та же буква?'
    ],
    build(play, api) {
      play.append(cipherWidget('%#№@$#&', ['модем', 'монитор', 'ноутбук', 'принтер', 'сканер'], 'монитор', {
        say: api.say, ok: () => api.solve('Верно! Это слово «монитор».'), bad: (m) => { api.attempt(); api.say(m, 'bad'); }
      }));
    },
    explain() {
      return h('div', null,
        h('ol', null,
          h('li', { html: '<b>Считаем знаки.</b> В шифре их 7. В словах: модем — 5, сканер — 6; а монитор, ноутбук, принтер — по 7.' }),
          h('li', { html: '<b>Ищем одинаковые знаки.</b> «#» стоит на 2-м и 6-м местах. Значит, и в слове на 2-м и 6-м местах — одна и та же буква.' }),
          h('li', { html: 'мОнитОр — на 2-м и 6-м местах «о» и «о» ✓. ноутбук: «о» и «у» ✗. принтер: «р» и «е» ✗.' }),
          h('li', { html: 'Ответ: <b>монитор</b>.' })),
        h('p', { class: 'small muted', html: 'Идея шифрования: одна и та же буква всегда превращается в один и тот же знак, а разные буквы — в разные.' }));
    },
    practiceTitle: 'Ещё потренироваться: новые шифры',
    practice(body) {
      const mount = h('div'), f = h('p', { class: 'fb' });
      const gen = () => {
        const g = genCipher();
        mount.replaceChildren(cipherWidget(g.cipher, g.options, g.answer, {
          say: (m, k) => { f.className = 'fb ' + k; f.textContent = m; },
          ok: (w) => { f.className = 'fb ok'; f.textContent = `Верно! Это «${w}».`; K.burst(f); },
          bad: (m) => { f.className = 'fb bad'; f.textContent = m; }
        }));
        f.textContent = '';
      };
      body.append(mount, f, h('button', { class: 'btn ghost', type: 'button', onclick: gen }, 'Новый шифр')); gen();
    }
  };

  K.App({
    title: 'Олимпиада KIBERone · неделя 5',
    sub: 'Младшая группа, 6–10 лет',
    intro: 'Привет! Сегодня три задачи: загадочное число, робот-посудомойка и кодовое слово. Если трудно — нажимай «Подсказка». Когда решишь, на вкладке появится звёздочка ⭐',
    tasks: [t1, t2, t3]
  });
})();

</script>
