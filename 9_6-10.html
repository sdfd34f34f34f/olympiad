<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Неделя 9 для 6–10 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{max-width:68ch}
.story>*+*{margin-top:10px}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}


/* Макет: яркий «игровой» стиль, толстые контуры, объёмные кнопки. Синий и жёлтый акценты. 6–10 лет. */
:root{
  --bg:#E8F0FF;--surface:#FFFFFF;--surface2:#F2F6FF;--ink:#1A2848;--muted:#4F5E80;
  --edge:#1A2848;--line:#CBD8F2;--line-strong:#8EA5D6;
  --accent:#2F6BFF;--on-accent:#FFFFFF;--accent2:#FFC21A;--on-accent2:#2A1E00;
  --good:#12803F;--good-bg:#DCF5E5;--bad:#C4372A;--bad-bg:#FDE7E3;--star:#FFC21A;
  --field:#FFFFFF;--hint-bg:#FFF4CC;--hint-edge:#E5B312;--code-inline:#E1E9FB;--focus:#2F6BFF;
  --card-shadow:0 6px 0 rgba(26,40,72,.16);
  --radius:16px;--radius-lg:26px;--bw:3px;--bw-thin:2px;--lift:4px;--fs:18px;--maxw:820px;
  --f-display:'Rubik','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}

.top h1{font-size:clamp(1.35rem,6vw,2.1rem);font-weight:800}
.task-head h2{font-weight:800}
.tab{font-family:var(--f-display);font-weight:700}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.stage{display:grid;gap:14px}

/* крест */
.cr{width:100%;max-width:340px;height:auto;display:block;margin-inline:auto}
.cr .sh{fill:var(--surface2);stroke:var(--edge);stroke-width:4;stroke-linejoin:round}
.cr text{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cr .q{fill:var(--accent)}
.cr .cn circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:3}
.cr .cn.hl circle{fill:var(--accent2);stroke:var(--edge)}
.cr .cn.hl text{fill:var(--on-accent2)}
.cr .sd.hl text{fill:var(--accent)}
.ops{display:flex;gap:10px;flex-wrap:wrap}
.ops .btn{min-width:56px;font-size:1.4em;font-family:var(--f-display);padding:.15em .6em}
.ops .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.eqs{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.eqs li{display:flex;gap:10px;align-items:center;padding:.5em .8em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.05em;flex-wrap:wrap}
.eqs li.ok{background:var(--good-bg);border-color:var(--good)}
.eqs li.bad{background:var(--bad-bg);border-color:var(--bad)}
.eqs li i{font-style:normal;margin-left:auto}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer-row .lbl{font-family:var(--f-display);font-weight:800}

/* блок-схема из слотов */
.sf{position:relative;max-width:430px;margin-inline:auto;width:100%;height:500px}
.sf .col{position:absolute;left:0;top:0;width:76%;height:100%}
.slot{position:absolute;left:0;width:100%;height:54px;display:grid;place-items:center;text-align:center;padding:2px 10px;cursor:pointer;background:var(--surface);border:var(--bw) dashed var(--line-strong);border-radius:12px;font-weight:700;font-size:.82rem;line-height:1.15;color:var(--ink);transition:background .15s}
.slot:hover{background:var(--surface2)}
.slot.full{border-style:solid;border-color:var(--edge);background:var(--surface2)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.slot.ok{border-color:var(--good);background:var(--good-bg)}
.slot.run{background:var(--accent2);color:var(--on-accent2);border-color:var(--edge);transform:scale(1.03)}
.slot .ph{color:var(--muted);font-weight:700}
.slot.dia{height:120px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0;background:var(--line-strong);padding:0}
.slot.dia>span{display:grid;place-items:center;width:calc(100% - 6px);height:calc(100% - 6px);margin:3px;background:var(--surface);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0 22%}
.slot.dia.full>span{background:var(--surface2)}
.slot.dia.bad{background:var(--bad)}.slot.dia.ok{background:var(--good)}.slot.dia.run{background:var(--accent2)}
.slot.dia.bad>span{background:var(--bad-bg)}.slot.dia.ok>span{background:var(--good-bg)}.slot.dia.run>span{background:var(--accent2)}
.slot.dia.full{background:var(--edge)}
.slot.dia{transform:none}
.arr{position:absolute;left:50%;width:0;height:22px;border-left:var(--bw) solid var(--edge);transform:translateX(-50%)}
.arr::after{content:"";position:absolute;left:-8px;bottom:-2px;border:7px solid transparent;border-top:9px solid var(--edge);border-bottom:0}
.sf .lbl2{position:absolute;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--muted)}
.loop{position:absolute;left:76%;width:17%;border:var(--bw) solid var(--edge);border-left:0;border-radius:0 14px 14px 0}
.loop::before{content:"";position:absolute;left:-2px;top:-8px;border:7px solid transparent;border-right:9px solid var(--edge);border-left:0}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipb{cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;padding:.4em .9em;border-radius:999px;border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge);min-height:44px}
.chipb[aria-pressed="true"]{background:var(--accent2);color:var(--on-accent2)}
.chipb:disabled{opacity:.35;box-shadow:none;cursor:default}
.plates{font-weight:800;font-family:var(--f-display)}

/* шифр */
.ciph{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tile{display:grid;place-items:center;width:clamp(36px,10.4vw,52px);height:clamp(44px,12vw,60px);border-radius:10px;border:var(--bw) solid var(--edge);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,5vw,1.6rem);position:relative}
.tile small{position:absolute;bottom:-1.4em;font-size:.55em;font-family:var(--f-body);color:var(--muted);font-weight:700}
.ciph{padding-bottom:1.4em}
.tile.hl{background:var(--accent2);color:var(--on-accent2)}
.tile.ltr{background:var(--surface2)}
.wcards{display:grid;gap:10px}
.wcard{cursor:pointer;text-align:left;display:grid;gap:6px;padding:.7em .9em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);box-shadow:0 var(--lift) 0 var(--edge);font:inherit;color:var(--ink)}
.wcard:hover{background:var(--surface2)}
.wcard .wd{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.wcard .letters{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:1.3em}
.wcard .letters .tile{width:clamp(30px,9vw,40px);height:clamp(36px,10vw,46px);font-size:1.05rem;border-width:2px}
.wcard .note{font-size:.85em;color:var(--muted);font-weight:700;min-height:1.2em}
.wcard.out{opacity:.45;background:var(--surface2)}
.wcard.out .wd{text-decoration:line-through}
.wcard.good{border-color:var(--good);background:var(--good-bg)}
.wcard.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lupe{display:flex;gap:10px;flex-wrap:wrap}

/* ===== неделя 9, 6–10 лет ===== */
.stage{display:grid;gap:14px;min-width:0}
.task,.task>*{min-width:0}
.field.wide{min-width:0;width:100%;max-width:18em}
select.field{max-width:100%;min-width:0;width:100%}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer-row .lbl{font-family:var(--f-display);font-weight:800}
.sub-h{font-family:var(--f-display);font-weight:800;font-size:.95rem;margin:0}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.btn.okb,.tog.okb{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.btn.badb,.tog.badb{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.tog{cursor:pointer;font:inherit;font-weight:800;font-size:.9rem;min-height:44px;padding:.2em .9em;border-radius:12px;border:var(--bw-thin) solid var(--edge);background:var(--surface);color:var(--ink)}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tog.okb[aria-pressed="true"]{background:var(--good-bg);color:var(--ink)}
.tog.badb[aria-pressed="true"]{background:var(--bad-bg);color:var(--ink)}
.poem{margin:0;line-height:1.45}
.eqbox{margin:0;text-align:center;font-family:var(--f-display);font-weight:800;min-height:1.6em;overflow-wrap:anywhere}
.v-ok{color:var(--good);font-weight:800}
table.tbl.left td,table.tbl.left th{text-align:left;font-size:.85rem}
.b{font-weight:800}
/* замки */
.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tops{grid-template-columns:repeat(6,minmax(0,1fr))}}
.topf{margin:0;display:grid;gap:4px;justify-items:center;padding:6px;border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);background:#fff;min-width:0}
.topf img{display:block;max-width:100%;height:68px;object-fit:contain}
.topf figcaption{font-size:.78rem;font-weight:800;color:#1A2848}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cast{display:grid;gap:6px;align-content:start;padding:8px;border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);background:var(--surface);min-width:0}
.cast .pic{display:grid;place-items:center;height:130px;background:#fff;border-radius:10px;overflow:hidden}
.cast .pic img{max-width:100%;max-height:122px;object-fit:contain}
label.dl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;text-align:left;font-size:.9rem}
label.dl b{font-family:var(--f-display)}
.tv{width:56px;height:56px;color:#1A2848}
.tvopts{display:flex;gap:10px;flex-wrap:wrap}
.btn.tvb{background:#fff;padding:.3em;min-width:72px}
.btn.tvb.okb{background:var(--good-bg)}.btn.tvb.badb{background:var(--bad-bg)}
/* схема маршрутов */
.dagbox{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:4px}
.dag{display:block;width:100%;height:auto;max-width:520px;margin-inline:auto}
.dag .de{stroke:var(--edge);stroke-width:2.2;fill:none}
.dag polygon.de{fill:var(--edge);stroke:var(--edge);stroke-width:1;stroke-linejoin:round}
.dag .de.dim{opacity:.35}
.dag .de.on{stroke:var(--accent);stroke-width:4;opacity:1}
.dag polygon.de.on{fill:var(--accent);stroke:var(--accent)}
.dag .de.cut{stroke:var(--bad);opacity:.45;stroke-dasharray:4 3}
.dag polygon.de.cut{fill:var(--bad)}
.dag .dn circle{fill:var(--surface);stroke:var(--edge);stroke-width:2.4}
.dag .dn.home circle{fill:var(--accent2)}
.dag .dn.on circle{fill:var(--accent);stroke:var(--edge)}
.dag .dn.tap{cursor:pointer;outline:none}
.dag .dn.tap:hover circle,.dag .dn.tap:focus-visible circle{fill:var(--hint-bg);stroke:var(--accent);stroke-width:3.4}
.dag .dn.sel circle{stroke:var(--accent);stroke-width:4}
.dag .lb{text-anchor:middle;font-family:var(--f-display);font-weight:800;font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface2);stroke-width:3px;stroke-linejoin:round}
.dag .bd{text-anchor:middle;dominant-baseline:central;font-family:var(--f-display);font-weight:800;font-size:12px;fill:var(--ink)}
.dag .dn.on .bd{fill:var(--on-accent)}
.routes{display:grid;gap:8px;min-height:3em}
.rl{display:grid;gap:6px}
.rbtn{cursor:pointer;font:inherit;text-align:left;font-weight:700;font-size:.92rem;padding:.4em .7em;min-height:44px;border-radius:12px;border:var(--bw-thin) solid var(--line-strong);background:var(--surface);color:var(--ink);overflow-wrap:anywhere}
.rbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.grp{display:grid;gap:6px}
/* игры */
.venn2{display:block;width:100%;max-width:360px;height:auto;margin-inline:auto}
.venn2 .va{fill:var(--accent);fill-opacity:.28;stroke:var(--accent);stroke-width:2.5}
.venn2 .vc{fill:var(--accent2);fill-opacity:.34;stroke:var(--accent2);stroke-width:2.5}

<script>
/* ===== общее ядро: помощники, оболочка задания, навигация ===== */
const K = (function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function s(tag, props, ...kids) {
    const el = document.createElementNS(NS, tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) { if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return el;
  }

  const PAGE = () => window.PAGE_ID || 'p';
  const Store = {
    get(k, d) { try { const v = localStorage.getItem('olymp:' + PAGE() + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('olymp:' + PAGE() + ':' + k, JSON.stringify(v)); } catch (e) { /* хранилище может быть недоступно */ } }
  };

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const onEnter = (el, fn) => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
  const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function burst(anchor) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = anchor ? anchor.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cols = ['--accent', '--accent2', '--good', '--star'];
    for (let i = 0; i < 26; i++) {
      const c = h('i', { class: 'confetti' });
      c.style.left = cx + 'px'; c.style.top = cy + 'px';
      c.style.background = 'var(' + cols[i % cols.length] + ')';
      document.body.append(c);
      const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 140;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 60;
      const anim = c.animate ? c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px,${dy + 140}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }) : null;
      if (anim) anim.onfinish = () => c.remove(); else c.remove();
    }
  }

  function mascot(mood) {
    mood = mood || 'happy';
    const mouths = { happy: 'M24 42 Q32 49 40 42', think: 'M25 44 H39', wow: 'M32 41 m-3.5 0 a3.5 4.5 0 1 0 7 0 a3.5 4.5 0 1 0 -7 0' };
    const st = { stroke: 'var(--edge)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    return s('svg', { viewBox: '0 0 64 62', class: 'mascot', 'aria-hidden': 'true' },
      s('line', { x1: 32, y1: 4, x2: 32, y2: 13, ...st }),
      s('circle', { cx: 32, cy: 5, r: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 3, y: 28, width: 8, height: 15, rx: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 53, y: 28, width: 8, height: 15, rx: 4, fill: 'var(--accent2)', ...st, 'stroke-width': 2.4 }),
      s('rect', { x: 9, y: 13, width: 46, height: 44, rx: 15, fill: 'var(--accent)', ...st }),
      s('rect', { x: 15, y: 21, width: 34, height: 28, rx: 10, fill: 'var(--surface)', ...st, 'stroke-width': 2.4 }),
      s('circle', { cx: 25, cy: 32, r: 3.4, fill: 'var(--edge)' }),
      s('circle', { cx: 39, cy: 32, r: 3.4, fill: 'var(--edge)' }),
      s('path', { d: mouths[mood], fill: mood === 'wow' ? 'var(--edge)' : 'none', ...st, 'stroke-width': 2.6 })
    );
  }

  function stepper(min, max, val, onChange, fmt) {
    let v = val;
    const out = h('output', { 'aria-live': 'polite' });
    const draw = () => { out.textContent = fmt ? fmt(v) : String(v); };
    const mk = (label, d, sign) => h('button', { type: 'button', 'aria-label': label, onclick: () => { const nv = Math.max(min, Math.min(max, v + d)); if (nv !== v) { v = nv; draw(); onChange(v); } } }, sign);
    draw();
    const el = h('span', { class: 'stepper' }, mk('меньше', -1, '−'), out, mk('больше', 1, '+'));
    el.get = () => v; el.set = (n) => { v = n; draw(); };
    return el;
  }

  /* ---------- оболочка задания ---------- */
  const app = { tasks: [], tabs: [], show: null };

  function Task(cfg) {
    const st = { solved: false, attempts: 0, hints: 0, shown: false };
    const fb = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
    const play = h('div', { class: 'play' });
    const hintsBox = h('div', { class: 'hints' });
    const explainBox = h('div');
    const nextBox = h('div');
    const hintBtn = h('button', { class: 'btn sm', type: 'button' });
    const revealBtn = h('button', { class: 'btn sm ghost', type: 'button' }, 'Показать разбор');
    revealBtn.hidden = true;
    const hints = cfg.hints || [];
    const upd = () => {
      hintBtn.textContent = st.hints < hints.length ? `Подсказка (${st.hints}/${hints.length})` : 'Подсказки закончились';
      hintBtn.disabled = st.hints >= hints.length;
      hintBtn.hidden = !hints.length;
      revealBtn.hidden = st.solved || st.shown || !(st.hints >= 2 || st.attempts >= 3);
    };
    hintBtn.onclick = () => {
      if (st.hints >= hints.length) return;
      const t = hints[st.hints++];
      hintsBox.append(h('div', { class: 'bubble' }, mascot(cfg.moodHint || 'think'), h('div', { class: 'say', html: `<b>Подсказка ${st.hints}.</b> ` + t })));
      upd();
    };
    revealBtn.onclick = () => { showExplain(); st.shown = true; upd(); };

    const root = h('section', { class: 'task', id: 'task-' + cfg.id, hidden: true, 'aria-labelledby': 'h-' + cfg.id },
      h('div', { class: 'task-head' }, h('span', { class: 'num', 'aria-hidden': 'true' }, cfg.num), h('h2', { id: 'h-' + cfg.id }, cfg.title), h('span', { class: 'badge-done' }, 'Решено')),
      typeof cfg.story === 'string' ? h('div', { class: 'story', html: cfg.story }) : h('div', { class: 'story' }, cfg.story),
      play, fb,
      h('div', { class: 'helpers' }, hintBtn, revealBtn),
      hintsBox, explainBox, nextBox
    );

    function showExplain() {
      if (explainBox.firstChild) return;
      const body = typeof cfg.explain === 'function' ? cfg.explain(api) : h('div', { html: cfg.explain });
      explainBox.append(h('div', { class: 'explain' }, h('h3', null, 'Разбор'), body));
    }

    const api = {
      el: root, play, st, id: cfg.id,
      say(msg, kind) { fb.className = 'fb ' + (kind || 'info'); fb.textContent = msg; },
      attempt() { st.attempts++; upd(); },
      isSolved: () => st.solved,
      solve(msg, anchor) {
        if (msg) api.say(msg, 'ok');
        if (st.solved) return;
        st.solved = true; root.classList.add('solved');
        Store.set('done:' + cfg.id, true);
        app.markDone(cfg.id);
        burst(anchor || fb);
        showExplain(); upd();
        const nxt = app.nextOf(cfg.id);
        if (nxt) nextBox.append(h('button', { class: 'btn primary next', type: 'button', onclick: () => { app.show(nxt); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'Дальше: ' + nxt.title + ' →'));
        else nextBox.append(h('p', { class: 'fb ok' }, cfg.finale || 'Все задачи решены. Отличная работа!'));
      }
    };
    upd();
    cfg.build(play, api);
    if (cfg.practice) {
      const body = h('div', { class: 'pbody' });
      const det = h('details', { class: 'practice' }, h('summary', null, cfg.practiceTitle || 'Ещё потренироваться'), body);
      let built = false;
      det.addEventListener('toggle', () => { if (det.open && !built) { built = true; cfg.practice(body); } });
      root.insertBefore(det, nextBox);
    }
    return { id: cfg.id, title: cfg.title, num: cfg.num, el: root, api };
  }

  function App(cfg) {
    const root = $('#app');
    const tabsEl = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Задачи' });
    const wrap = h('div', { class: 'wrap' },
      h('header', { class: 'top' }, mascot('happy'), h('div', null, h('h1', null, cfg.title), h('p', { class: 'sub' }, cfg.sub))),
      cfg.intro ? h('div', { class: 'box intro', html: cfg.intro }) : null,
      tabsEl
    );
    root.append(wrap);
    const star = () => s('svg', { class: 'star', viewBox: '0 0 24 24', 'aria-hidden': 'true' }, s('path', { d: 'M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17l-5.8 3.3 1.4-6.4L2.7 9.5l6.5-.7z', 'stroke-linejoin': 'round' }));
    const tasks = cfg.tasks.map(t => Task(t));
    app.tasks = tasks;
    tasks.forEach((t, i) => {
      const tab = h('button', { class: 'tab' + (Store.get('done:' + t.id, false) ? ' done' : ''), role: 'tab', type: 'button', 'aria-selected': 'false', 'aria-controls': 'task-' + t.id, onclick: () => show(t) }, star(), 'Задача ' + t.num);
      t.tab = tab; tabsEl.append(tab); wrap.append(t.el);
    });
    function show(t) {
      tasks.forEach(x => { const on = x === t; x.el.hidden = !on; x.tab.setAttribute('aria-selected', on ? 'true' : 'false'); });
      Store.set('tab', t.id);
    }
    app.show = show;
    app.markDone = (id) => { const t = tasks.find(x => x.id === id); if (t) t.tab.classList.add('done'); };
    app.nextOf = (id) => { const i = tasks.findIndex(x => x.id === id); return tasks[i + 1] || null; };
    const saved = Store.get('tab', null);
    show(tasks.find(t => t.id === saved) || tasks[0]);
    return wrap;
  }

  return { $, $$, h, s, Store, rnd, pick, shuffle, onEnter, plural, sleep, burst, mascot, stepper, Task, App };
})();

        if (v === 16) { in1.className = 'field ok'; in1.readOnly = true; f1.className = 'fb small ok'; f1.textContent = 'Верно! Постарели двое, значит 10 + 3 + 3 = 16 лет.'; ok.a = true; done(); return; }
        api.attempt(); in1.className = 'field bad'; f1.className = 'fb small bad';
        f1.textContent = v === 13 ? 'Ты прибавил(а) 3 только один раз. Но «проживут» эти 3 года и Боря, и компьютер — то есть прибавить надо два раза по 3.' : v === 10 ? 'Это сумма, которая была сначала. Прошло 3 года — возраст изменился.' : v === 19 ? 'Слишком много: 3 года добавляются каждому по одному разу, всего 3 + 3 = 6 лет, а не 9.' : v === 6 ? 'Это только добавка (3 + 3). К ней надо прибавить прежнюю сумму 10.' : 'Нет. К сумме 10 прибавь 3 года Бори и 3 года компьютера. Посмотри «помощника» выше: поставь 3 года.';
      };
      onEnter(in1, c1);
      /* 2 */
      const sh = K.stepper(0, 11, 3, () => updV(), n => String(n));
      const vm = h('div'); const updV = () => { vm.replaceChildren(vennGames(11, 12, sh.get()), h('p', { class: 'eqbox' }, `Разных игр: 11 + 12 − ${sh.get()} = ${23 - sh.get()}`)); }; updV();
      const f2 = h('p', { class: 'fb small', role: 'status' }), in2 = h('input', { class: 'field', type: 'number', inputmode: 'numeric', 'aria-label': 'Ответ на вторую задачу' });
      const c2 = () => {
        const v = num(in2.value); if (isNaN(v)) { f2.className = 'fb small bad'; f2.textContent = 'Впиши число игр.'; return; }
        if (v === 20) { in2.className = 'field ok'; in2.readOnly = true; f2.className = 'fb small ok'; f2.textContent = 'Верно! 11 + 12 = 23, но 3 игры посчитаны дважды: 23 − 3 = 20 разных игр.'; ok.g = true; done(); return; }
        api.attempt(); in2.className = 'field bad'; f2.className = 'fb small bad';
        f2.textContent = v === 23 ? 'Это 11 + 12. Но 3 одинаковые игры в сумме посчитаны дважды (и у Радмира, и у Матвея), а «разных» надо считать по одному разу.' : v === 17 ? '17 = 8 + 9 — это игры, которые есть только у одного из друзей. Но 3 общие игры — тоже игры, их тоже надо посчитать один раз: 8 + 3 + 9.' : v === 8 || v === 9 ? 'Это игры только одного друга. Посчитай всё вместе: игры только у Радмира, общие и игры только у Матвея.' : v === 3 ? '3 — это только одинаковые игры. Спрашивают, сколько всего разных игр.' : 'Нет. Сложи игры друзей и вычти те, что посчитаны дважды. Подвигай «помощника» выше: поставь 3 общие игры.';
      };
      onEnter(in2, c2);
      play.append(
        h('div', { class: 'box stage' }, h('p', { class: 'sub-h' }, 'Задача 1'),
          h('label', { class: 'row' }, h('span', null, 'Сколько лет пройдёт:'), yr), sumOut,
          h('div', { class: 'answer-row' }, h('span', { class: 'lbl' }, 'Ответ:'), in1, h('span', null, 'лет'), h('button', { class: 'btn primary', type: 'button', onclick: c1 }, 'Проверить')), f1),
        h('div', { class: 'box stage' }, h('p', { class: 'sub-h' }, 'Задача 2'),
          h('label', { class: 'row' }, h('span', null, 'Сколько игр одинаковых:'), sh), vm,
          h('div', { class: 'answer-row' }, h('span', { class: 'lbl' }, 'Ответ:'), in2, h('span', null, 'игр'), h('button', { class: 'btn primary', type: 'button', onclick: c2 }, 'Проверить')), f2));
    },
    explain() {
      return h('div', null,
        h('p', null, h('b', null, '1) 16 лет. '), 'Боря и его компьютер — двое. Каждому добавится 3 года, всего 3 + 3 = 6 лет. Было 10, стало 10 + 6 = 16.'),
        h('p', null, h('b', null, '2) 20 игр. '), 'У Радмира 11 игр, у Матвея 12. Если сложить, получится 23, но 3 одинаковые игры мы посчитали дважды. Вычтем лишний раз: 23 − 3 = 20 разных игр. Другой способ: только у Радмира 11 − 3 = 8, только у Матвея 12 − 3 = 9, общих 3: 8 + 3 + 9 = 20.'),
        h('p', { class: 'small muted' }, 'Если у вас в презентации ответ «17» — это 8 + 9, то есть игры, которые есть только у одного друга; общие игры в этот ответ не попали. В вопросе «сколько всего разных игр» общие игры тоже входят, поэтому верный ответ 20.'));
    },
    practiceTitle: 'Ещё потренироваться: похожие задачки',
    practice(body) {
      const NM = [['Бори', 'его компьютера'], ['Ани', 'её планшета'], ['Миши', 'его робота'], ['Лизы', 'её ноутбука'], ['Тимура', 'его телефона']];
      const GM = [['Радмира', 'Матвея', 'игр'], ['Кати', 'Даши', 'игр'], ['Олега', 'Паши', 'файлов с картинками'], ['Иры', 'Сони', 'приложений']];
      const mount = h('div'), f = h('p', { class: 'fb', role: 'status' });
      const gen = () => {
        f.textContent = ''; f.className = 'fb';
        let text, ans, why;
        if (Math.random() < 0.5) {
          const [a, b] = pick(NM), S = rnd(6, 20), y = rnd(2, 6);
          text = `Возраст ${a} и ${b} в сумме составляет ${S} ${pl(S, 'год', 'года', 'лет')}. Какой будет сумма их возрастов через ${y} ${pl(y, 'год', 'года', 'лет')}?`; ans = S + 2 * y; why = `Стареют двое: ${S} + ${y} + ${y} = ${ans}.`;
        } else {
          const [a, b, w] = pick(GM), A = rnd(8, 20), B = rnd(8, 20), C = rnd(2, Math.min(A, B) - 2);
          text = `У ${a} было установлено ${A} ${w}, а у ${b} — ${B}. При этом ${C} из них у друзей были одинаковыми. Сколько всего разных из них было у друзей вместе?`; ans = A + B - C; why = `${A} + ${B} = ${A + B}, но ${C} одинаковых посчитаны дважды: ${A + B} − ${C} = ${ans}.`;
        }
        const inp = h('input', { class: 'field', type: 'number', inputmode: 'numeric', 'aria-label': 'Ответ' });
        const chk = () => { const v = num(inp.value); if (isNaN(v)) { f.className = 'fb bad'; f.textContent = 'Впиши число.'; return; } if (v === ans) { f.className = 'fb ok'; f.textContent = 'Верно! ' + why; K.burst(f); } else { f.className = 'fb bad'; f.textContent = 'Пока нет. Вспомни: возраст растёт у обоих; а одинаковые предметы нельзя считать дважды.'; } };
        onEnter(inp, chk);
        mount.replaceChildren(h('p', { class: 'poem' }, text), h('div', { class: 'answer-row' }, inp, h('button', { class: 'btn primary', type: 'button', onclick: chk }, 'Проверить')));
      };
      body.append(mount, f, h('button', { class: 'btn ghost', type: 'button', onclick: gen }, 'Другая задачка')); gen();
    }
  };

  K.App({
    title: 'Олимпиада KIBERone · неделя 9',
    sub: 'Младшая группа, 6–10 лет',
    intro: 'Привет! Сегодня три задачи: найти, какой замок как выглядит сверху, посчитать маршруты по планетам и решить две хитрые задачки. Если трудно — нажимай «Подсказка». Когда решишь, на вкладке появится звёздочка ⭐',
    tasks: [t1, t2, t3]
  });
})();

</script>
