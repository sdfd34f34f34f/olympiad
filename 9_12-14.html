<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Неделя 9 для 12–14 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{max-width:68ch}
.story>*+*{margin-top:10px}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}


/* Макет: рабочее место участника контеста, светлая бумага и тёмные панели кода, синий акцент и янтарная подсветка. 12–14 лет. */
:root{
  --bg:#EDF0F6;--surface:#FFFFFF;--surface2:#F4F6FB;--ink:#16202E;--muted:#536074;
  --edge:#16202E;--line:#D2D9E6;--line-strong:#97A6BF;
  --accent:#2457E6;--on-accent:#FFFFFF;--accent2:#F0A81C;--on-accent2:#1B1300;
  --good:#11803E;--good-bg:#DDF3E4;--bad:#BE321D;--bad-bg:#FCE6E1;--star:#F0A81C;
  --field:#FFFFFF;--hint-bg:#E9EFFF;--hint-edge:#8AA5F0;--code-inline:#E1E7F3;--focus:#2457E6;
  --code-bg:#0F1624;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(240,168,28,.22);--code-line:#26324A;
  --card-shadow:none;
  --radius:7px;--radius-lg:12px;--bw:1.5px;--bw-thin:1px;--lift:0px;--fs:16.5px;--maxw:940px;
  --f-display:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D121A;--surface:#151C27;--surface2:#1B2433;--ink:#E5EBF5;--muted:#9AA8BF;
  --edge:#42536E;--line:#26324A;--line-strong:#4B5C78;
  --accent:#7399FF;--on-accent:#0A142C;--accent2:#F5B73A;--on-accent2:#1B1300;
  --good:#5BD58A;--good-bg:#123221;--bad:#FF8E7A;--bad-bg:#42201A;--star:#F5B73A;
  --field:#0D121A;--hint-bg:#1B2849;--hint-edge:#4E69B8;--code-inline:#26324A;--focus:#8FB0FF;
  --code-bg:#080C13;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(245,183,58,.2);--code-line:#26324A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121A;--surface:#151C27;--surface2:#1B2433;--ink:#E5EBF5;--muted:#9AA8BF;
  --edge:#42536E;--line:#26324A;--line-strong:#4B5C78;
  --accent:#7399FF;--on-accent:#0A142C;--accent2:#F5B73A;--on-accent2:#1B1300;
  --good:#5BD58A;--good-bg:#123221;--bad:#FF8E7A;--bad-bg:#42201A;--star:#F5B73A;
  --field:#0D121A;--hint-bg:#1B2849;--hint-edge:#4E69B8;--code-inline:#26324A;--focus:#8FB0FF;
  --code-bg:#080C13;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(245,183,58,.2);--code-line:#26324A;color-scheme:dark}

.top .mascot,.bubble .mascot{display:none}
.top h1{font-size:clamp(1.2rem,4.8vw,1.9rem);font-weight:800;letter-spacing:-.02em}
.top h1::before{content:"> ";color:var(--accent)}
.task-head h2{font-size:clamp(1.05rem,3.8vw,1.4rem);font-weight:800}
.num{border-radius:6px;font-family:var(--f-mono)}
.tab{font-family:var(--f-mono);font-size:.9em}
.bubble .say{border-radius:var(--radius)}
.btn{box-shadow:none}
.btn.primary{border-color:var(--accent)}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.box{display:grid;gap:10px}
.sub-h{font-family:var(--f-mono);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* код */
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.88rem;line-height:1.75;border-radius:var(--radius);padding:10px 0;overflow-x:auto;max-width:100%}
.code .ln{display:block;padding:0 14px;white-space:pre;min-height:1.75em}
.code .ln.on{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--accent2)}
.code .kw{color:#8DB4FF;font-weight:700}
.code .cm{color:var(--code-muted)}
.tabs-s{display:flex;gap:6px;flex-wrap:wrap}
.pill{cursor:pointer;border:var(--bw-thin) solid var(--line-strong);background:var(--surface);color:var(--ink);padding:.3em .8em;border-radius:999px;font-weight:700;font-size:.88em;min-height:36px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.vars{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-mono)}
.vars span{background:var(--surface);border:var(--bw-thin) solid var(--line-strong);border-radius:6px;padding:.15em .6em;font-weight:800}
.vars span b{color:var(--accent)}
table.tbl td input.field{width:5.5em;min-height:38px;padding:.2em .4em;text-align:center}
table.tbl td.mono,table.tbl th{font-family:var(--f-mono)}
table.tbl tr.cur td{background:var(--hint-bg)}
table.tbl td.okc{background:var(--good-bg);color:var(--good);font-weight:800}
.stepx{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stepx label{display:grid;gap:4px;font-size:.88em;font-weight:700;color:var(--muted)}

/* диаграмма Венна */
.vwrap{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(220px,1fr);gap:18px;align-items:start}
@media (max-width:700px){.vwrap{grid-template-columns:minmax(0,1fr)}}
.vd{position:relative;width:100%;max-width:440px;aspect-ratio:320/300;margin-inline:auto}
.vd svg{position:absolute;inset:0;width:100%;height:100%}
.vd text{font-family:var(--f-body);font-weight:800;font-size:11.5px;fill:var(--ink)}
input.rg{position:absolute;transform:translate(-50%,-50%);width:3.1em;height:2.2em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:clamp(.85rem,3.3vw,1.05rem);border:var(--bw) solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0;color:var(--ink)}
input.rg:focus{border-color:var(--accent)}
.clues{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.clues li{display:grid;grid-template-columns:1.6em 1fr;gap:6px;align-items:start;padding:.45em .6em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface)}
.clues li i{font-style:normal;font-weight:800;font-family:var(--f-mono);text-align:center}
.clues li.ok{background:var(--good-bg);border-color:var(--good)}.clues li.ok i{color:var(--good)}
.clues li.bad{background:var(--bad-bg);border-color:var(--bad)}.clues li.bad i{color:var(--bad)}
.vtotal{font-family:var(--f-mono);font-weight:800}

/* проверка */
.ed{width:100%;min-height:220px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:var(--bw) solid var(--code-line);border-radius:var(--radius);padding:12px 14px;font-family:var(--f-mono);font-size:.9rem;line-height:1.65;tab-size:4;white-space:pre;overflow:auto}
.ed:focus{border-color:var(--accent)}
.io{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.io textarea{width:100%;min-height:96px;font-family:var(--f-mono);font-size:.88rem;resize:vertical}
.console{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.88rem;border-radius:var(--radius);padding:10px 14px;min-height:72px;white-space:pre-wrap;overflow-wrap:anywhere}
.console.err{color:#FFB4A5}
.verd{width:100%}
.verd td,.verd th{font-size:.9em}
.v-ok{color:var(--good);font-weight:800}.v-bad{color:var(--bad);font-weight:800}
.parsons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.plist{display:grid;gap:6px;align-content:start;min-height:60px;padding:8px;border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);background:var(--surface2)}
.pline{cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:.82rem;background:var(--code-bg);color:var(--code-ink);border:var(--bw-thin) solid var(--code-line);border-radius:6px;padding:.45em .7em;white-space:pre-wrap;overflow-wrap:anywhere;min-height:38px}
.pline:hover{border-color:var(--accent)}
.pline .pn{color:var(--code-muted);margin-right:.7em}
.calc{font-family:var(--f-mono);font-size:.9rem;display:grid;gap:4px}
.calc div{display:grid;grid-template-columns:minmax(9em,12em) 1fr;gap:10px}
.calc div span:first-child{color:var(--muted);font-family:var(--f-body);font-weight:700}
.calc div.total{font-weight:800;color:var(--accent);border-top:var(--bw-thin) solid var(--line-strong);padding-top:6px;margin-top:4px}
@media (max-width:520px){.calc div{grid-template-columns:1fr;gap:0}}
.iotable{width:100%;font-family:var(--f-mono);font-size:.88rem}
.iotable pre{margin:0;font-family:inherit}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}


/* ===== неделя 5 ===== */
.fcw{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.fcw{grid-template-columns:minmax(0,1fr)}}
svg.flow{width:100%;height:auto;display:block;max-width:420px;margin-inline:auto}
svg.flow .nd rect,svg.flow .nd polygon,svg.flow .nd ellipse,svg.flow .nd path{fill:var(--surface);stroke:var(--edge);stroke-width:1.6}
svg.flow .nd text{font-family:var(--f-mono);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg.flow .nd.cur rect,svg.flow .nd.cur polygon,svg.flow .nd.cur ellipse{stroke:var(--accent2);stroke-width:3.4;fill:var(--code-hl)}
svg.flow .nd.seen rect,svg.flow .nd.seen polygon,svg.flow .nd.seen ellipse{fill:var(--good-bg);stroke:var(--good)}
svg.flow .ed{fill:none;stroke:var(--line-strong);stroke-width:1.8}
svg.flow .ed.used{stroke:var(--accent2);stroke-width:3}
svg.flow .lb{font-family:var(--f-mono);font-weight:800;font-size:11px;fill:var(--muted);text-anchor:middle}
.ctl{display:grid;gap:10px}
.ctl .q{font-weight:800}
.vars span.mm b{color:var(--accent2)}

.bt{border-collapse:collapse;width:100%;table-layout:fixed;min-width:0}
.bt th,.bt td{border:var(--bw-thin) solid var(--line-strong);padding:0;text-align:center}
.bt th{font-family:var(--f-mono);font-size:.78rem;background:var(--surface2);padding:.35em 0;line-height:1.15}
.bt th.pn{width:5.9em}
.bt td.pn{font-weight:800;text-align:left;padding:.3em .5em;font-size:.92em;background:var(--surface2)}
.bt button.cell{width:100%;min-height:40px;background:var(--field);border:0;cursor:pointer;font-family:var(--f-mono);font-weight:800;font-size:1.05rem;color:var(--muted)}
.bt button.cell[data-v="1"]{background:var(--good-bg);color:var(--good)}
.bt button.cell[data-v="-1"]{background:var(--bad-bg);color:var(--bad)}
.bt button.cell:hover{filter:brightness(.96)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;font-size:.88em;color:var(--muted)}
.legend b{font-family:var(--f-mono);color:var(--ink)}
.clues li.unk i{color:var(--muted)}
.mini-q{display:grid;gap:8px}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);padding:.4em .8em;background:var(--surface);cursor:pointer;min-height:40px}
.chk label:has(input:checked){background:var(--hint-bg);border-color:var(--accent)}

.tl{width:100%;height:auto;display:block}
.tl .fm{fill:var(--accent)}.tl .ad{fill:var(--accent2)}.tl .gh{fill:none;stroke:var(--accent2);stroke-width:1.5;stroke-dasharray:4 3}
.tl text{font-family:var(--f-mono);font-size:9px;fill:var(--muted);text-anchor:middle}
.tl .tk{stroke:var(--line-strong);stroke-width:1}
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sim label{display:grid;gap:4px;font-weight:700;font-size:.9em;color:var(--muted)}
.chal{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.chal li{display:flex;gap:8px;align-items:center;padding:.4em .7em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface)}
.chal li.ok{background:var(--good-bg);border-color:var(--good)}
.chal li i{font-style:normal;font-weight:800;font-family:var(--f-mono);width:1.4em;text-align:center}
.stage{display:grid;gap:12px}
.pline.used{opacity:.4}
.pline.in{border-color:var(--accent)}
.pline.err{border-color:var(--bad)}
.verd th,.verd td{padding:.35em .5em;text-align:left;vertical-align:top;font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere}
.verd td.t,.verd th.t{white-space:nowrap}

/* ===== неделя 9, 12–14 лет ===== */
.task,.task>*{min-width:0}
.stage{display:grid;gap:12px;min-width:0}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub-h{font-family:var(--f-mono);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.tog{cursor:pointer;font:inherit;font-weight:700;min-height:44px;padding:.2em .9em;border-radius:var(--radius);border:var(--bw-thin) solid var(--line-strong);background:var(--surface);color:var(--ink)}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mz-msg{margin:0;min-height:2.6em;font-weight:600;padding:.5em .7em;border-radius:var(--radius);background:var(--surface2);border:var(--bw-thin) dashed var(--line-strong);overflow-wrap:anywhere}

  /* ================= Задача 3. Билеты в кино ================= */
  const gcd = (a, b) => b ? gcd(b, a % b) : a, lcm = (a, b) => a / gcd(a, b) * b;
  function cinema(c) {
    const L = c.reduce(lcm), per = [];

    const P = per.length;
    return { L, P, per, F: (n) => Math.floor(n / P) * L + per[n % P].t, ev: (n) => ({ t: Math.floor(n / P) * L + per[n % P].t, lane: per[n % P].lane }) };
  }
  const CM = cinema([30, 50, 75]);
  const TBL = [5, 6, 10, 33, 108];
  function diag(cm, n, v) {
    const ans = cm.F(n), P = cm.P, L = cm.L, q = Math.floor(n / P), r = n % P;
    if (v === ans) return null;
    if (n >= 1 && v === cm.F(n - 1)) return `Это время для ${n - 1} человек. Перед тобой стоят ${n}: нужен момент с номером ${n} (счёт с нуля: самый первый момент — номер 0).`;
    if (v === cm.F(n + 1)) return `Это на одного человека больше. Перед тобой ровно n = ${n} человек.`;
    if (q > 0 && v === q * L) return `Ты учёл(а) только полные периоды по ${L} с (${q} × ${L} = ${q * L}). А ещё ${r} ${pl(r, 'человек', 'человека', 'человек')} остаются после них — это добавка из начала списка.`;
    if (q > 0 && v === (q + 1) * L + cm.per[r].t) return `Слишком много: полных периодов по ${L} с только ${q}, потому что ${q} × ${P} = ${q * P} людей уже обслужены.`;
    if (v % 5 !== 0) return 'Моменты освобождения кассиров — числа из таблиц умножения 30, 50 и 75 (0, 30, 50, 60, 75, 90, 100, …). Выпиши их по порядку и найди нужный.';
    return `Нет. Выпиши моменты освобождения кассиров по порядку (0, 0, 0, 30, 50, …) и найди ${n + 1}-й по счёту (счёт начинается с нуля: n = 0 — первый).` + (n > 20 ? ` Для больших n используй период: ${L} с — каждые ${P} человек.` : '');
  }

    const W = 460, x = (t) => 12 + t / tmax * 436, ys = [38, 72, 106];
    const svg = s('svg', { viewBox: `0 0 ${W} 150`, class: 'tl-svg', role: 'img', 'aria-label': 'Моменты освобождения кассиров на оси времени' });
    for (let t = 0; t <= tmax; t += cm.L) { svg.append(s('line', { x1: x(t), x2: x(t), y1: 14, y2: 118, class: 'per' })); svg.append(s('text', { x: x(t), y: 140, class: 'ax', text: t + ' с' })); }
    c.forEach((cx, k) => { svg.append(s('text', { x: 14, y: ys[k] - 10, class: 'cl' + k + ' clb', text: `кассир ${k + 1}: ${cx} с` })); svg.append(s('line', { x1: 12, x2: 448, y1: ys[k], y2: ys[k], class: 'lane' })); for (let t = 0; t <= tmax; t += cx) svg.append(s('circle', { cx: x(t), cy: ys[k], r: 4, class: 'tick cl' + k })); });
    const e = cm.ev(n); if (e.t <= tmax) { svg.append(s('line', { x1: x(e.t), x2: x(e.t), y1: 14, y2: 118, class: 'cur' })); svg.append(s('circle', { cx: x(e.t), cy: ys[e.lane], r: 8, class: 'ring' })); }
    return svg;
  }
  const t3 = {
    id: 'cinema', num: 3, title: 'Билеты в кино',
    story: '<p><b>Это задача не на программирование!</b> Но она сложная.</p><p>Сегодня премьера нового фильма. Вы пришли к открытию кассы, но перед вами в очереди уже стоят <b>n</b> человек. Билеты продают три кассира. Первый обслуживает одного посетителя за <b>30</b> секунд, второй — за <b>50</b>, третий — за <b>75</b>. Очередь одна, и стоящий в начале очереди отправляется к первому освободившемуся кассиру. Все кассиры начинают работать одновременно. Сколько времени вам нужно ждать в очереди?</p><p>Пример: если n = 4, то ждать 50 секунд — первые три человека уйдут к трём кассирам, через 30 с освободится первый кассир и к нему уйдёт четвёртый человек, а через 50 с освободится второй кассир, и вы попадёте к нему.</p><p class="muted">Заполни таблицу: для n = 5, 6, 10, 33, 108 найди время ожидания (в секундах).</p>',

        };

      });
      /* мини-проверка: период */
      const pin = h('input', { class: 'field cnt', type: 'number', inputmode: 'numeric', 'aria-label': 'Сколько человек за 150 секунд' }), pf = h('span', { class: 'rf small' });

          h('div', { class: 'answer-row' }, inp, h('span', null, 'с'), h('button', { class: 'btn primary', type: 'button', onclick: chk }, 'Проверить'),
