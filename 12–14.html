<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Олимпиадный контест 12–14 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;500;800&display=swap">
<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{display:grid;gap:10px;max-width:68ch}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}

/* Макет: рабочее место участника контеста, светлая бумага и тёмные панели кода, синий акцент и янтарная подсветка. 12–14 лет. */
:root{
  --bg:#EDF0F6;--surface:#FFFFFF;--surface2:#F4F6FB;--ink:#16202E;--muted:#536074;
  --edge:#16202E;--line:#D2D9E6;--line-strong:#97A6BF;
  --accent:#2457E6;--on-accent:#FFFFFF;--accent2:#F0A81C;--on-accent2:#1B1300;
  --good:#11803E;--good-bg:#DDF3E4;--bad:#BE321D;--bad-bg:#FCE6E1;--star:#F0A81C;
  --field:#FFFFFF;--hint-bg:#E9EFFF;--hint-edge:#8AA5F0;--code-inline:#E1E7F3;--focus:#2457E6;
  --code-bg:#0F1624;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(240,168,28,.22);--code-line:#26324A;
  --card-shadow:none;
  --radius:7px;--radius-lg:12px;--bw:1.5px;--bw-thin:1px;--lift:0px;--fs:16.5px;--maxw:940px;
  --f-display:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D121A;--surface:#151C27;--surface2:#1B2433;--ink:#E5EBF5;--muted:#9AA8BF;
  --edge:#42536E;--line:#26324A;--line-strong:#4B5C78;
  --accent:#7399FF;--on-accent:#0A142C;--accent2:#F5B73A;--on-accent2:#1B1300;
  --good:#5BD58A;--good-bg:#123221;--bad:#FF8E7A;--bad-bg:#42201A;--star:#F5B73A;
  --field:#0D121A;--hint-bg:#1B2849;--hint-edge:#4E69B8;--code-inline:#26324A;--focus:#8FB0FF;
  --code-bg:#080C13;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(245,183,58,.2);--code-line:#26324A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121A;--surface:#151C27;--surface2:#1B2433;--ink:#E5EBF5;--muted:#9AA8BF;
  --edge:#42536E;--line:#26324A;--line-strong:#4B5C78;
  --accent:#7399FF;--on-accent:#0A142C;--accent2:#F5B73A;--on-accent2:#1B1300;
  --good:#5BD58A;--good-bg:#123221;--bad:#FF8E7A;--bad-bg:#42201A;--star:#F5B73A;
  --field:#0D121A;--hint-bg:#1B2849;--hint-edge:#4E69B8;--code-inline:#26324A;--focus:#8FB0FF;
  --code-bg:#080C13;--code-ink:#DCE6F7;--code-muted:#7D8BA6;--code-hl:rgba(245,183,58,.2);--code-line:#26324A;color-scheme:dark}

.top .mascot,.bubble .mascot{display:none}
.top h1{font-size:clamp(1.2rem,4.8vw,1.9rem);font-weight:800;letter-spacing:-.02em}
.top h1::before{content:"> ";color:var(--accent)}
.task-head h2{font-size:clamp(1.05rem,3.8vw,1.4rem);font-weight:800}
.num{border-radius:6px;font-family:var(--f-mono)}
.tab{font-family:var(--f-mono);font-size:.9em}
.bubble .say{border-radius:var(--radius)}
.btn{box-shadow:none}
.btn.primary{border-color:var(--accent)}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.box{display:grid;gap:10px}
.sub-h{font-family:var(--f-mono);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* код */
.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.88rem;line-height:1.75;border-radius:var(--radius);padding:10px 0;overflow-x:auto;max-width:100%}
.code .ln{display:block;padding:0 14px;white-space:pre;min-height:1.75em}
.code .ln.on{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--accent2)}
.code .kw{color:#8DB4FF;font-weight:700}
.code .cm{color:var(--code-muted)}
.tabs-s{display:flex;gap:6px;flex-wrap:wrap}
.pill{cursor:pointer;border:var(--bw-thin) solid var(--line-strong);background:var(--surface);color:var(--ink);padding:.3em .8em;border-radius:999px;font-weight:700;font-size:.88em;min-height:36px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.vars{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-mono)}
.vars span{background:var(--surface);border:var(--bw-thin) solid var(--line-strong);border-radius:6px;padding:.15em .6em;font-weight:800}
.vars span b{color:var(--accent)}
table.tbl td input.field{width:5.5em;min-height:38px;padding:.2em .4em;text-align:center}
table.tbl td.mono,table.tbl th{font-family:var(--f-mono)}
table.tbl tr.cur td{background:var(--hint-bg)}
table.tbl td.okc{background:var(--good-bg);color:var(--good);font-weight:800}
.stepx{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stepx label{display:grid;gap:4px;font-size:.88em;font-weight:700;color:var(--muted)}

/* диаграмма Венна */
.vwrap{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(220px,1fr);gap:18px;align-items:start}
@media (max-width:700px){.vwrap{grid-template-columns:minmax(0,1fr)}}
.vd{position:relative;width:100%;max-width:440px;aspect-ratio:320/300;margin-inline:auto}
.vd svg{position:absolute;inset:0;width:100%;height:100%}
.vd text{font-family:var(--f-body);font-weight:800;font-size:11.5px;fill:var(--ink)}
input.rg{position:absolute;transform:translate(-50%,-50%);width:3.1em;height:2.2em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:clamp(.85rem,3.3vw,1.05rem);border:var(--bw) solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0;color:var(--ink)}
input.rg:focus{border-color:var(--accent)}
.clues{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.clues li{display:grid;grid-template-columns:1.6em 1fr;gap:6px;align-items:start;padding:.45em .6em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface)}
.clues li i{font-style:normal;font-weight:800;font-family:var(--f-mono);text-align:center}
.clues li.ok{background:var(--good-bg);border-color:var(--good)}.clues li.ok i{color:var(--good)}
.clues li.bad{background:var(--bad-bg);border-color:var(--bad)}.clues li.bad i{color:var(--bad)}
.vtotal{font-family:var(--f-mono);font-weight:800}

/* проверка */
.ed{width:100%;min-height:220px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:var(--bw) solid var(--code-line);border-radius:var(--radius);padding:12px 14px;font-family:var(--f-mono);font-size:.9rem;line-height:1.65;tab-size:4;white-space:pre;overflow:auto}
.ed:focus{border-color:var(--accent)}
.io{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.io textarea{width:100%;min-height:96px;font-family:var(--f-mono);font-size:.88rem;resize:vertical}
.console{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.88rem;border-radius:var(--radius);padding:10px 14px;min-height:72px;white-space:pre-wrap;overflow-wrap:anywhere}
.console.err{color:#FFB4A5}
.verd{width:100%}
.verd td,.verd th{font-size:.9em}
.v-ok{color:var(--good);font-weight:800}.v-bad{color:var(--bad);font-weight:800}
.parsons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.plist{display:grid;gap:6px;align-content:start;min-height:60px;padding:8px;border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);background:var(--surface2)}
.pline{cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:.82rem;background:var(--code-bg);color:var(--code-ink);border:var(--bw-thin) solid var(--code-line);border-radius:6px;padding:.45em .7em;white-space:pre-wrap;overflow-wrap:anywhere;min-height:38px}
.pline:hover{border-color:var(--accent)}
.pline .pn{color:var(--code-muted);margin-right:.7em}
.calc{font-family:var(--f-mono);font-size:.9rem;display:grid;gap:4px}
.calc div{display:grid;grid-template-columns:minmax(9em,12em) 1fr;gap:10px}
.calc div span:first-child{color:var(--muted);font-family:var(--f-body);font-weight:700}
.calc div.total{font-weight:800;color:var(--accent);border-top:var(--bw-thin) solid var(--line-strong);padding-top:6px;margin-top:4px}
@media (max-width:520px){.calc div{grid-template-columns:1fr;gap:0}}
.iotable{width:100%;font-family:var(--f-mono);font-size:.88rem}
.iotable pre{margin:0;font-family:inherit}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

</style>

      total.textContent = all ? `Всего учеников в группе: ${sum}` : 'Заполни все семь областей (где никого нет, пиши 0).';
      status.className = 'fb ' + (okAll ? 'ok' : 'info');
      status.textContent = okAll ? 'Все условия выполнены. Теперь сосчитай, сколько всего учеников.' : '';
      onChange && onChange({ okAll, all, sum });
    }
    for (const k in VPOS) {
      const inp = h('input', { class: 'rg', type: 'text', inputmode: 'numeric', maxlength: 3, id: 'rg-' + Math.random().toString(36).slice(2, 7), 'aria-label': `Область: ${VNAME[k]}`, style: { left: (VPOS[k][0] / 320 * 100) + '%', top: (VPOS[k][1] / 300 * 100) + '%' } });
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, ''); vals[k] = inp.value === '' ? null : parseInt(inp.value, 10); update(); });
      inputs[k] = inp; vd.append(inp);
    }
    host.append(h('div', { class: 'vwrap' }, vd, h('div', { class: 'box' }, h('div', { class: 'sub-h' }, 'Условия'), ul, status, total)));
    update();
    return { inputs };
  }

  const MAIN_PHR = [{ pl: 'гуляли по городу', sg: 'гулял по городу' }, { pl: 'смотрели кино', sg: 'смотрел кино' }, { pl: 'общались в чате', sg: 'общался в чате' }];
  const task2 = {
    id: 'c2', num: 2, title: 'Дубайский отдых',
    story: `<p>Группа учеников кибер-школы отправилась в тур в Дубай. В один из вечеров они разделились. Пятнадцать человек пошли гулять по городу. Смотреть кино пошли семнадцать человек. Гуляли по городу, смотрели кино и вечером общались в чате группы — пятеро. Гуляли по городу, общались в чате, но не смотрели кино — шестеро. Сколько учеников было в группе, если известно, что в чате вечером собралось одиннадцать человек, а среди тех, кто и гулял по городу, и смотрел кино, нет тех, кто не вышел в чат?</p>
      <p class="muted small">Считаем, что каждый ученик гулял, смотрел кино или делал и то и другое.</p>`,
    hints: [
      'Рисуй диаграмму Эйлера–Венна: три круга. Начни с центра, где пересекаются все три круга: сколько там человек?',
      'В чате 11 человек: 5 в центре и 6 «гуляли и в чате, но без кино». 5 + 6 = 11. Значит, в чате нет никого другого. Какие области чата тогда равны нулю?',
      'Область «гуляли и смотрели кино, но не в чате» равна 0 по условию. Теперь из 15 гулявших вычти уже расставленных. Из 17 смотревших тоже.'
    ],
    build(play, api) {
      let state = null;
      venn(play, { phr: MAIN_PHR, short: ['Гуляли', 'Кино', 'Чат'], tot: [15, 17, 11], g: 5, e: 6 }, st => { state = st; });
      const ask = h('div', { class: 'box' }, h('p', { style: { fontWeight: 700 } }, 'Сколько учеников было в группе?'));
      numAnswer(ask, (v, inp, btn) => {
        api.attempt();
        if (v === 27) { mark(inp, true); api.solve('Верно! В группе было 27 учеников.', btn); }
        else {
          mark(inp, false);
          api.say(v === 32 ? '32 = 15 + 17. Но пятеро, которые гуляли и смотрели кино, посчитаны дважды.' : v === 26 || v === 28 ? 'Почти. Проверь все условия на диаграмме: они должны быть зелёными.' : 'Не сходится. Заполни диаграмму так, чтобы все условия стали зелёными, и сложи числа во всех областях.', 'bad');
        }
      }, 'Число учеников');
      play.append(ask);
    },
    explain: `<ol>
      <li>В чате 11 человек: 5 гуляли и смотрели кино, ещё 6 гуляли, но кино не смотрели. 5 + 6 = 11, поэтому в чате нет других людей. Все участники чата уже входят в круг «Гуляли».</li>
      <li>Все, кто гулял и смотрел кино, были в чате. Значит, таких только пятеро: «гуляли и смотрели кино, но не в чате» = 0.</li>
      <li>Гуляли: 15 = 5 + 6 + 4, то есть 4 человека гуляли без кино и без чата. Кино смотрели: 17 = 5 + 12, то есть 12 человек смотрели только кино.</li>
      <li>Всего: 4 + 6 + 5 + 12 = <b>27</b>. Другая запись: 15 + 17 − 5 = <b>27</b> (пятерых, которые попали в оба круга, считаем один раз).</li></ol>
      <p>Формула включений–исключений для двух множеств: |A ∪ B| = |A| + |B| − |A ∩ B|.</p>`,
    practice(box) {
      const holder = h('div'), askBox = h('div', { class: 'box' }), res = h('div', { class: 'fb', role: 'status' });
      const SETS = [
        { phr: MAIN_PHR, short: ['Гуляли', 'Кино', 'Чат'] },
        { phr: [{ pl: 'играли в футбол', sg: 'играл в футбол' }, { pl: 'ходили на концерт', sg: 'ходил на концерт' }, { pl: 'ужинали в кафе', sg: 'ужинал в кафе' }], short: ['Футбол', 'Концерт', 'Кафе'] },
        { phr: [{ pl: 'плавали в бассейне', sg: 'плавал в бассейне' }, { pl: 'рисовали', sg: 'рисовал' }, { pl: 'пили чай', sg: 'пил чай' }], short: ['Бассейн', 'Рисование', 'Чай'] }
      ];
      let cur;
      function gen() {
        const a = rnd(2, 9), b = rnd(5, 14), g = rnd(2, 6), e = rnd(2, 7), set = pick(SETS);
        cur = { ans: a + b + e + g };
        holder.replaceChildren(); askBox.replaceChildren(); res.textContent = ''; res.className = 'fb';
        venn(holder, { ...set, tot: [a + e + g, b + g, e + g], g, e }, null);
        askBox.append(h('p', { style: { fontWeight: 700 } }, 'Сколько учеников в группе? (Каждый ученик участвовал хотя бы в одном из первых двух событий.)'));
        numAnswer(askBox, (v, inp) => { if (v === cur.ans) { mark(inp, true); res.className = 'fb ok'; res.textContent = 'Верно! Условия те же по структуре: в третьем множестве нет «лишних» людей.'; K.burst(inp); } else { mark(inp, false); res.className = 'fb bad'; res.textContent = 'Нет. Заполни области так, чтобы все условия позеленели.'; } }, 'Число учеников');
      }
      box.append(h('p', null, 'Похожая задача с другими числами. Диаграмма поможет и здесь.'), holder, askBox, res, h('button', { class: 'btn', type: 'button', onclick: gen }, 'Другая задача'));
      gen();
    }
  };

  /* ---------- Задача 3: Шаолиньский Даня ---------- */
  const REF = (n, m, sec, p) => { const t = n * (m * 60 + sec) + (n - 1) * p; return [Math.floor(t / 60), t % 60]; };
  const TESTS = [[4, 3, 24, 70], [1, 0, 1, 0], [1, 59, 59, 120], [100, 59, 59, 120], [2, 0, 30, 30], [3, 1, 0, 0], [10, 0, 1, 120], [5, 2, 15, 45]].map(t => ({ inp: t.join('\n'), exp: REF(...t).join('\n'), args: t }));
  const SOLUTION = ['n = int(input())', 'm = int(input())', 's = int(input())', 'p = int(input())', 'full_time = n * (m * 60 + s) + (n - 1) * p', 'print(full_time // 60)', 'print(full_time % 60)'];
  const DISTRACT = ['full_time = n * (m * 60 + s) + n * p', 'print(full_time / 60)', 'print(full_time % 100)'];

  function judge(code, tests) {
    return tests.map((t, i) => {
      const r = PyRun.run(code, t.inp);
      if (r.err) return { i, v: r.err.kind === 'TimeoutError' ? 'TL' : 'RE', msg: PyRun.describe(r.err), got: r.out, t };
      const g = r.out.trim().split(/\s+/).filter(Boolean).join(' '), e = t.exp.split(/\s+/).join(' ');
      return { i, v: g === e ? 'OK' : 'WA', got: r.out.trim(), t };
    });
  }
  const VTXT = { OK: 'Верно', WA: 'Неверный ответ', RE: 'Ошибка выполнения', TL: 'Превышено время' };

  const task3 = {
    id: 'c3', num: 3, title: 'Шаолиньский Даня',
    story: `<p>Даня готовится к спортивным соревнованиям и тренируется по системе шаолиньских монахов. Тренировка состоит из <b>N</b> подходов, каждый из которых длится <b>M</b> минут и <b>S</b> секунд. Между каждой парой подряд идущих подходов должен быть перерыв длительностью <b>P</b> секунд. Определите, сколько всего времени займёт тренировка.</p>
      <p><b>Ввод</b> (четыре строки): N (1 ≤ N ≤ 100), M (0 ≤ M ≤ 59), S (0 ≤ S ≤ 59), P (0 ≤ P ≤ 120). Один подход занимает ненулевое время.<br><b>Вывод</b>: два целых числа, на разных строках: количество полных минут и количество секунд (от 0 до 59). Ограничение по времени: 1 секунда.</p>
      <div class="hscroll"><table class="tbl iotable"><thead><tr><th>Ввод</th><th>Вывод</th></tr></thead><tbody><tr><td><pre>4\n3\n24\n70</pre></td><td><pre>17\n6</pre></td></tr></tbody></table></div>
      <p class="muted small">Пояснение к примеру: 4 подхода по 3 мин 24 с и 3 перерыва по 70 с дают 17 минут 6 секунд.</p>`,
    hints: [
      'Переведи всё в секунды. Один подход длится <code>M * 60 + S</code> секунд. Всего подходов <code>N</code>.',
      'Сколько перерывов, если подходов N? Для N = 2 перерыв один, для N = 3 два. А при N = 1?',
      'Общее время в секундах: <code>T = N * (M * 60 + S) + (N - 1) * P</code>. Минуты — это <code>T // 60</code>, секунды — <code>T % 60</code>.'
    ],
    build(play, api) {
      // шаг 1: калькулятор
      const vals = { n: 4, m: 3, s: 24, p: 70 };
      const calc = h('div', { class: 'calc', 'aria-live': 'polite' });
      const drawCalc = () => {
        const { n, m, s: sec, p } = vals, one = m * 60 + sec, work = n * one, br = n - 1, brs = br * p, tot = work + brs;
        calc.replaceChildren(
          ...[['Один подход', `${m}·60 + ${sec} = ${one} с`], ['Все подходы', `${n} · ${one} = ${work} с`], ['Перерывов', `${n} − 1 = ${br}`], ['Все перерывы', `${br} · ${p} = ${brs} с`]].map(([a, b]) => h('div', null, h('span', null, a), h('span', null, b))),
          h('div', { class: 'total' }, h('span', null, 'Всего'), h('span', null, `${work} + ${brs} = ${tot} с = ${Math.floor(tot / 60)} мин ${tot % 60} с`)));
      };
      const inputsRow = h('div', { class: 'stepx' }, ...[['n', 'N, подходов', 1, 100], ['m', 'M, минут', 0, 59], ['s', 'S, секунд', 0, 59], ['p', 'P, пауза (с)', 0, 120]].map(([k, label, lo, hi]) => {
        const inp = h('input', { class: 'field mono', type: 'number', min: lo, max: hi, value: vals[k], id: 'c3-' + k, 'aria-label': label, style: { width: '100%' } });
        inp.addEventListener('input', () => { const v = parseInt(inp.value, 10); if (Number.isFinite(v)) { vals[k] = Math.max(lo, Math.min(hi, v)); drawCalc(); } });
        return h('label', null, label, inp);
      }));
      drawCalc();
      const q1 = h('input', { class: 'field', type: 'number', id: 'c3-q1', 'aria-label': 'Перерывов при N = 5' }), q2 = h('input', { class: 'field', type: 'number', id: 'c3-q2', 'aria-label': 'Перерывов при N = 1' });
      const qfb = h('div', { class: 'fb', role: 'status' });
      const qcheck = () => {
        const a = q1.value === '' ? null : Number(q1.value), b = q2.value === '' ? null : Number(q2.value);
        q1.className = 'field' + (a == null ? '' : a === 4 ? ' ok' : ' bad'); q2.className = 'field' + (b == null ? '' : b === 0 ? ' ok' : ' bad');
        qfb.className = 'fb ' + (a === 4 && b === 0 ? 'ok' : 'info'); qfb.textContent = a === 4 && b === 0 ? 'Верно. Именно поэтому в формуле стоит (N − 1), а не N.' : '';
      };
      q1.addEventListener('input', qcheck); q2.addEventListener('input', qcheck);
      play.append(h('div', { class: 'box' }, h('div', { class: 'sub-h' }, 'Шаг 1. Разберись вручную'), h('p', { class: 'muted small' }, 'Меняй данные и смотри, как считается время. Начальные значения соответствуют примеру.'), inputsRow, calc,
        h('div', { class: 'row' }, 'Сколько перерывов при N = 5?', q1, 'А при N = 1?', q2), qfb));

      // шаг 2: режимы
      let mode = 'build';
      const modeBar = h('div', { class: 'tabs-s', role: 'group', 'aria-label': 'Режим' }, ...[['build', 'Собрать из строк'], ['write', 'Написать самому']].map(([k, t]) => h('button', { class: 'pill', type: 'button', 'aria-pressed': k === mode ? 'true' : 'false', 'data-mode': k, onclick: () => setMode(k) }, t)));
      const pool = h('div', { class: 'plist', 'aria-label': 'Доступные строки' }), mine = h('div', { class: 'plist', 'aria-label': 'Твоя программа' });
      const pool0 = shuffle(SOLUTION.concat(DISTRACT)); let chosen = [];
      const drawParsons = () => {
        pool.replaceChildren(...pool0.filter(l => !chosen.includes(l)).map(l => h('button', { class: 'pline', type: 'button', onclick: () => { chosen.push(l); drawParsons(); } }, l)));
        mine.replaceChildren(...chosen.map((l, i) => h('button', { class: 'pline', type: 'button', 'aria-label': 'Убрать строку: ' + l, onclick: () => { chosen.splice(i, 1); drawParsons(); } }, h('span', { class: 'pn' }, i + 1), l)));
        if (!chosen.length) mine.append(h('span', { class: 'muted small' }, 'Нажимай на строки слева в нужном порядке. Среди них есть лишние.'));
      };
      const parsonsBox = h('div', { class: 'parsons' }, h('div', null, h('div', { class: 'sub-h' }, 'Строки'), pool), h('div', null, h('div', { class: 'sub-h' }, 'Программа'), mine));
      const ed = h('textarea', { class: 'ed', id: 'c3-code', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', 'aria-label': 'Код программы на Python' });
      ed.value = '# Считай данные: N, M, S, P\nn = int(input())\nm = int(input())\ns = int(input())\np = int(input())\n\n# Посчитай общее время в секундах и выведи минуты и секунды\n';
      ed.addEventListener('keydown', e => {
        if (e.key === 'Tab') { e.preventDefault(); const a = ed.selectionStart; ed.setRangeText('    ', a, ed.selectionEnd, 'end'); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
      });
      const sandbox = h('div', { class: 'box' },
        h('div', { class: 'io' }, h('label', null, h('span', { class: 'sub-h' }, 'Входные данные'), h('textarea', { class: 'field', id: 'c3-stdin', 'aria-label': 'Входные данные' }, '4\n3\n24\n70')), h('div', null, h('div', { class: 'sub-h' }, 'Вывод программы'), h('div', { class: 'console', id: 'c3-out', 'aria-live': 'polite' }, ''))),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: runOne }, 'Запустить на этих данных'), h('button', { class: 'btn primary', type: 'button', onclick: submit }, 'Отправить на проверку'), h('span', { class: 'muted small' }, 'Ctrl+Enter — проверка')));
      const verd = h('div', { 'aria-live': 'polite' });
      const note = h('p', { class: 'muted small' }, 'Мини-среда понимает основы Python: переменные, арифметику, input(), int(), print(), if, while, for. Для этой задачи этого достаточно.');
      play.append(h('div', { class: 'box' }, h('div', { class: 'sub-h' }, 'Шаг 2. Программа'), modeBar, parsonsBox, ed, sandbox, note), verd);
      function setMode(k) {
        mode = k; modeBar.querySelectorAll('.pill').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === k ? 'true' : 'false'));
        parsonsBox.hidden = k !== 'build'; ed.hidden = k !== 'write';
      }
      const code = () => mode === 'build' ? chosen.join('\n') : ed.value;
      function runOne() {
        const out = $out(); const r = PyRun.run(code(), $in().value);
        out.className = 'console' + (r.err ? ' err' : ''); out.textContent = (r.out || '') + (r.err ? (r.out ? '\n' : '') + PyRun.describe(r.err) : '');
        if (!r.err && !r.out) out.textContent = '(программа ничего не вывела)';
      }
      const $out = () => document.getElementById('c3-out'), $in = () => document.getElementById('c3-stdin');
      function submit() {
        if (mode === 'build' && !chosen.length) { api.say('Сначала собери программу из строк.', 'bad'); return; }
        api.attempt();
        const res = judge(code(), TESTS), okN = res.filter(r => r.v === 'OK').length;
        verd.replaceChildren(h('div', { class: 'box' },
          h('div', { class: 'sub-h' }, `Результат проверки: ${okN} из ${res.length}`),
          h('div', { class: 'hscroll' }, h('table', { class: 'tbl verd' },
            h('thead', null, h('tr', null, h('th', null, 'Тест'), h('th', null, 'Вердикт'), h('th', null, 'Подробности'))),
            h('tbody', null, res.map(r => h('tr', null, h('td', { class: 'mono' }, r.i + 1), h('td', { class: r.v === 'OK' ? 'v-ok' : 'v-bad' }, (r.v === 'OK' ? '✓ ' : '✗ ') + VTXT[r.v]),
              h('td', { style: { textAlign: 'left' } }, r.v === 'OK' ? '' : r.v === 'WA' ? (r.i === 0 ? `Вывод «${r.got.replace(/\s+/g, ' ')}», ожидалось «${r.t.exp.replace(/\s+/g, ' ')}»` : `Для данных N=${r.t.args[0]}, M=${r.t.args[1]}, S=${r.t.args[2]}, P=${r.t.args[3]} ожидалось «${r.t.exp.replace(/\s+/g, ' ')}», получено «${r.got.replace(/\s+/g, ' ') || 'пусто'}»`) : r.msg))))))));
        if (okN === res.length) api.solve('Принято! Все тесты пройдены.', verd); else api.say(`Пройдено тестов: ${okN} из ${res.length}. Посмотри таблицу и найди ошибку.`, 'bad');
      }
      drawParsons(); setMode('build');
    },
    explain: () => h('div', null,
      h('ol', null,
        h('li', null, 'Время одного подхода в секундах: ', h('code', null, 'M * 60 + S'), '. Все подходы: ', h('code', null, 'N * (M * 60 + S)'), '.'),
        h('li', null, 'Перерывы бывают только между подходами, поэтому их ', h('b', null, 'N − 1'), ' (при N = 1 перерывов нет). Время всех перерывов: ', h('code', null, '(N - 1) * P'), '.'),
        h('li', null, 'Общее время ', h('code', null, 'T = N * (M * 60 + S) + (N - 1) * P'), ' секунд. Минуты — целая часть деления на 60 (', h('code', null, 'T // 60'), '), секунды — остаток (', h('code', null, 'T % 60'), ').')),
      h('div', { class: 'code' }, SOLUTION.map(l => h('span', { class: 'ln' }, l))),
      h('p', null, 'Типичные ошибки: взять N перерывов вместо N − 1; вывести минуты дробным числом (', h('code', null, 'T / 60'), '); забыть, что секунд должно быть от 0 до 59. Поэтому в проверке есть крайние случаи: N = 1, паузы нулевые, максимальные значения.')),
    practice(box) {
      box.append(h('p', null, 'Попробуй придумать свои тесты: какие данные нужно проверить, чтобы найти ошибку «N перерывов вместо N − 1»? Запусти свою программу на них в окне выше и сравни с ручным расчётом.'));
    }
  };

  K.App({
    title: 'Олимпиадный контест',
    sub: 'Старшая группа, 12–14 лет · неделя 4',
    intro: '<p><b>Как работать.</b> В каждой задаче сначала разберись на небольших примерах, потом решай. Задача 3 проверяется автоматически, как на настоящей олимпиаде: после отправки решения ты увидишь вердикт по каждому тесту.</p>',
    tasks: [task1, task2, task3]
  });
})();
