<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Банк заданий 6–10 лет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== общий каркас: все цвета берутся из токенов страницы ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:var(--maxw);margin-inline:auto;display:grid;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;gap:16px;align-items:center}
.top .mascot{flex:none;width:76px;height:auto}
.top h1{font-size:clamp(1.4rem,5.4vw,2.2rem)}
.top .sub{color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:.55em 1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);font-weight:700;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tab .star{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;opacity:.55}
.tab.done .star{fill:var(--star);stroke:var(--edge);opacity:1}

.task{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius-lg);padding:clamp(14px,3.6vw,26px);display:grid;gap:18px;box-shadow:var(--card-shadow);min-width:0}
.task-head{display:flex;gap:12px;align-items:center}
.task-head h2{font-size:clamp(1.25rem,4.6vw,1.7rem);flex:1;min-width:0}
.num{flex:none;display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent2);color:var(--on-accent2);font-family:var(--f-display);font-weight:800}
.badge-done{display:none;font-weight:800;color:var(--good);border:var(--bw) solid var(--good);border-radius:999px;padding:.1em .7em;font-size:.85em}
.task.solved .badge-done{display:inline-block}
.story{max-width:68ch}
.story>*+*{margin-top:10px}
.story b{font-weight:800}
.play{display:grid;gap:14px;min-width:0}
.box{background:var(--surface2);border:var(--bw-thin) solid var(--line);border-radius:var(--radius);padding:clamp(12px,3vw,18px);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88em}
.mono{font-family:var(--f-mono)}

.btn{cursor:pointer;font-weight:700;padding:.6em 1.1em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(var(--lift));box-shadow:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:.35em .8em;font-size:.92em}
.field{border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--field);padding:.5em .7em;min-height:44px;min-width:0}
input.field[type=number]{width:7em;font-weight:800;font-family:var(--f-mono)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.field.ok,.cell.ok{border-color:var(--good);background:var(--good-bg)}
.field.bad,.cell.bad{border-color:var(--bad);background:var(--bad-bg)}

.fb{min-height:1.6em;font-weight:700}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)}
.fb.bad{color:var(--bad)}
.fb.info{color:var(--ink)}
.fb::first-letter{text-transform:uppercase}

.helpers{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints{display:grid;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease-out}
.bubble .mascot{flex:none;width:44px;height:auto}
.bubble .say{background:var(--hint-bg);border:var(--bw-thin) solid var(--hint-edge);border-radius:var(--radius);padding:.55em .9em;position:relative;min-width:0}
.bubble .say b{font-family:var(--f-display)}
.explain{border:var(--bw) solid var(--good);background:var(--good-bg);border-radius:var(--radius);padding:clamp(12px,3vw,20px);display:grid;gap:10px;animation:pop .3s ease-out}
.explain h3{font-size:1.1rem}
.explain ol,.explain ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.explain code,.story code,.hints code{font-family:var(--f-mono);font-size:.92em;background:var(--code-inline);padding:.05em .35em;border-radius:6px}

details.practice{border:var(--bw-thin) dashed var(--line-strong);border-radius:var(--radius);padding:.2em 1em}
details.practice>summary{cursor:pointer;font-weight:800;padding:.7em 0;min-height:44px;list-style-position:inside}
details.practice[open]>summary{border-bottom:var(--bw-thin) dashed var(--line-strong);margin-bottom:12px}
details.practice .pbody{display:grid;gap:14px;padding-bottom:14px}

.next{justify-self:start}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:var(--bw) solid var(--edge);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.2em;line-height:1;padding:0}
.stepper button:hover{background:var(--surface2)}
.stepper output{min-width:2.6em;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:1.2em}

.hscroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%}
table.tbl th,table.tbl td{border:var(--bw-thin) solid var(--line-strong);padding:.4em .6em;text-align:center}
table.tbl th{background:var(--surface2)}


/* Макет: яркий «игровой» стиль, толстые контуры, объёмные кнопки. Синий и жёлтый акценты. 6–10 лет. */
:root{
  --bg:#E8F0FF;--surface:#FFFFFF;--surface2:#F2F6FF;--ink:#1A2848;--muted:#4F5E80;
  --edge:#1A2848;--line:#CBD8F2;--line-strong:#8EA5D6;
  --accent:#2F6BFF;--on-accent:#FFFFFF;--accent2:#FFC21A;--on-accent2:#2A1E00;
  --good:#12803F;--good-bg:#DCF5E5;--bad:#C4372A;--bad-bg:#FDE7E3;--star:#FFC21A;
  --field:#FFFFFF;--hint-bg:#FFF4CC;--hint-edge:#E5B312;--code-inline:#E1E9FB;--focus:#2F6BFF;
  --card-shadow:0 6px 0 rgba(26,40,72,.16);
  --radius:16px;--radius-lg:26px;--bw:3px;--bw-thin:2px;--lift:4px;--fs:18px;--maxw:820px;
  --f-display:'Rubik','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1630;--surface:#17224A;--surface2:#1D2A58;--ink:#EDF1FF;--muted:#A9B7DE;
  --edge:#8FB0FF;--line:#2B3B72;--line-strong:#4F67B0;
  --accent:#6C9BFF;--on-accent:#06143A;--accent2:#FFCB3D;--on-accent2:#2A1E00;
  --good:#6CE29A;--good-bg:#12392A;--bad:#FF9183;--bad-bg:#47201C;--star:#FFCB3D;
  --field:#0E1630;--hint-bg:#3B3216;--hint-edge:#A98A25;--code-inline:#26376F;--focus:#9DBBFF;
  --card-shadow:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}

.top h1{font-size:clamp(1.35rem,6vw,2.1rem);font-weight:800}
.task-head h2{font-weight:800}
.tab{font-family:var(--f-display);font-weight:700}
.intro{background:var(--hint-bg);border-color:var(--hint-edge)}
.stage{display:grid;gap:14px}

/* крест */
.cr{width:100%;max-width:340px;height:auto;display:block;margin-inline:auto}
.cr .sh{fill:var(--surface2);stroke:var(--edge);stroke-width:4;stroke-linejoin:round}
.cr text{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.cr .q{fill:var(--accent)}
.cr .cn circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:3}
.cr .cn.hl circle{fill:var(--accent2);stroke:var(--edge)}
.cr .cn.hl text{fill:var(--on-accent2)}
.cr .sd.hl text{fill:var(--accent)}
.ops{display:flex;gap:10px;flex-wrap:wrap}
.ops .btn{min-width:56px;font-size:1.4em;font-family:var(--f-display);padding:.15em .6em}
.ops .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.eqs{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.eqs li{display:flex;gap:10px;align-items:center;padding:.5em .8em;border:var(--bw-thin) solid var(--line);border-radius:var(--radius);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.05em;flex-wrap:wrap}
.eqs li.ok{background:var(--good-bg);border-color:var(--good)}
.eqs li.bad{background:var(--bad-bg);border-color:var(--bad)}
.eqs li i{font-style:normal;margin-left:auto}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer-row .lbl{font-family:var(--f-display);font-weight:800}

/* блок-схема из слотов */
.sf{position:relative;max-width:430px;margin-inline:auto;width:100%;height:500px}
.sf .col{position:absolute;left:0;top:0;width:76%;height:100%}
.slot{position:absolute;left:0;width:100%;height:54px;display:grid;place-items:center;text-align:center;padding:2px 10px;cursor:pointer;background:var(--surface);border:var(--bw) dashed var(--line-strong);border-radius:12px;font-weight:700;font-size:.82rem;line-height:1.15;color:var(--ink);transition:background .15s}
.slot:hover{background:var(--surface2)}
.slot.full{border-style:solid;border-color:var(--edge);background:var(--surface2)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.slot.ok{border-color:var(--good);background:var(--good-bg)}
.slot.run{background:var(--accent2);color:var(--on-accent2);border-color:var(--edge);transform:scale(1.03)}
.slot .ph{color:var(--muted);font-weight:700}
.slot.dia{height:120px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0;background:var(--line-strong);padding:0}
.slot.dia>span{display:grid;place-items:center;width:calc(100% - 6px);height:calc(100% - 6px);margin:3px;background:var(--surface);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0 22%}
.slot.dia.full>span{background:var(--surface2)}
.slot.dia.bad{background:var(--bad)}.slot.dia.ok{background:var(--good)}.slot.dia.run{background:var(--accent2)}
.slot.dia.bad>span{background:var(--bad-bg)}.slot.dia.ok>span{background:var(--good-bg)}.slot.dia.run>span{background:var(--accent2)}
.slot.dia.full{background:var(--edge)}
.slot.dia{transform:none}
.arr{position:absolute;left:50%;width:0;height:22px;border-left:var(--bw) solid var(--edge);transform:translateX(-50%)}
.arr::after{content:"";position:absolute;left:-8px;bottom:-2px;border:7px solid transparent;border-top:9px solid var(--edge);border-bottom:0}
.sf .lbl2{position:absolute;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--muted)}
.loop{position:absolute;left:76%;width:17%;border:var(--bw) solid var(--edge);border-left:0;border-radius:0 14px 14px 0}
.loop::before{content:"";position:absolute;left:-2px;top:-8px;border:7px solid transparent;border-right:9px solid var(--edge);border-left:0}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipb{cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;padding:.4em .9em;border-radius:999px;border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge);min-height:44px}
.chipb[aria-pressed="true"]{background:var(--accent2);color:var(--on-accent2)}
.chipb:disabled{opacity:.35;box-shadow:none;cursor:default}
.plates{font-weight:800;font-family:var(--f-display)}

/* шифр */
.ciph{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tile{display:grid;place-items:center;width:clamp(36px,10.4vw,52px);height:clamp(44px,12vw,60px);border-radius:10px;border:var(--bw) solid var(--edge);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,5vw,1.6rem);position:relative}
.tile small{position:absolute;bottom:-1.4em;font-size:.55em;font-family:var(--f-body);color:var(--muted);font-weight:700}
.ciph{padding-bottom:1.4em}
.tile.hl{background:var(--accent2);color:var(--on-accent2)}
.tile.ltr{background:var(--surface2)}
.wcards{display:grid;gap:10px}
.wcard{cursor:pointer;text-align:left;display:grid;gap:6px;padding:.7em .9em;border-radius:var(--radius);border:var(--bw) solid var(--edge);background:var(--surface);box-shadow:0 var(--lift) 0 var(--edge);font:inherit;color:var(--ink)}
.wcard:hover{background:var(--surface2)}
.wcard .wd{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.wcard .letters{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:1.3em}
.wcard .letters .tile{width:clamp(30px,9vw,40px);height:clamp(36px,10vw,46px);font-size:1.05rem;border-width:2px}
.wcard .note{font-size:.85em;color:var(--muted);font-weight:700;min-height:1.2em}
.wcard.out{opacity:.45;background:var(--surface2)}
.wcard.out .wd{text-decoration:line-through}
.wcard.good{border-color:var(--good);background:var(--good-bg)}
.wcard.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lupe{display:flex;gap:10px;flex-wrap:wrap}

/* ===== тест: общая оболочка (цвета — из токенов страницы) ===== */
.tf{gap:16px}
.tf-screen{display:grid;gap:16px;min-width:0}
.tf-test,.tf-res{display:grid;gap:14px;min-width:0}
.tf-rules{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:68ch}
.tf-f{display:grid;gap:4px}
.tf-l{font-weight:700}
.tf-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tf-in .field{width:8.5em}
.tf-in .field.txt{width:min(15em,100%)}
.tf-in select.field{width:auto;min-width:9em}
.tf-fields{display:grid;gap:12px}

.tf-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--radius);padding:6px 12px}
.tf-clock{font-weight:800;font-size:1.15em;white-space:nowrap}
.tf-time{font-weight:800}
.tf-time.warn,.tf-bar.warn .tf-clock{color:var(--bad)}
.tf-bar.warn{border-color:var(--bad)}
.tf-prog{color:var(--muted);font-weight:700;font-size:.92em}
.tf-dots{display:flex;gap:6px;flex-wrap:wrap}
.tf-dot{cursor:pointer;min-width:44px;min-height:44px;border-radius:var(--radius);border:var(--bw-thin) solid var(--line-strong);background:var(--surface);font-weight:800;font-family:var(--f-mono)}
.tf-dot.ans{background:var(--hint-bg);border-color:var(--edge)}
.tf-dot.ans::after{content:"✓";font-size:.7em;margin-left:2px}
.tf-dot[aria-current="step"]{background:var(--accent);color:var(--on-accent);border-color:var(--edge)}
.tf-card{scroll-margin-top:80px}
.tf-pts{flex:none;font-weight:800;font-size:.85em;color:var(--muted);border:var(--bw-thin) solid var(--line-strong);border-radius:999px;padding:.1em .7em;white-space:nowrap}
.tf-nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.tf-confirm p{margin-bottom:10px;font-weight:700}

.tf-opts{display:grid;gap:8px}
.tf-opt{cursor:pointer;text-align:left;min-height:44px;padding:.55em 1em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface);font-weight:700}
.tf-opt::before{content:"○ ";font-weight:800}
.tf-opt[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.tf-opt[aria-checked="true"]::before{content:"● "}
.tf-pool{display:flex;flex-wrap:wrap;gap:8px}
.tf-chip{cursor:pointer;min-height:44px;padding:.5em .9em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface);font-weight:700;text-align:left}
.tf-chip:hover{background:var(--surface2)}
.tf-seq{margin:0;padding-left:1.8em;display:grid;gap:6px;min-height:2.4em}
.tf-seq li{padding:.3em .7em;border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);background:var(--surface2);overflow-wrap:anywhere}

.tf-nums{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--f-mono);font-weight:800;font-size:1.2em}
.tf-n{min-width:2.3em;padding:.25em .5em;text-align:center;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface2)}
.tf-n.q{background:var(--accent2);color:var(--on-accent2)}
.tf-sym{font-size:2.2rem;line-height:1;padding:.2em .3em;border:var(--bw) solid var(--edge);border-radius:var(--radius);background:var(--surface2)}
.tf-facts{margin:0;padding-left:1.3em;display:grid;gap:6px}
.tf-lgrid{border-collapse:collapse;margin-inline:auto}
.tf-lgrid td{width:clamp(40px,11.5vw,54px);height:clamp(40px,11.5vw,54px);text-align:center;border:var(--bw-thin) solid var(--line-strong);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.15em}
.tf-lgrid td.c{background:var(--accent2);color:var(--on-accent2)}
.tf-cards{display:flex;gap:8px;flex-wrap:wrap}
.tf-cards span{padding:.3em .7em;border:var(--bw) dashed var(--edge);border-radius:var(--radius);font-weight:800;background:var(--surface2);font-family:var(--f-mono)}

svg.tf-flow{width:100%;height:auto;display:block;max-width:380px;margin-inline:auto}
svg.tf-flow .nd rect,svg.tf-flow .nd polygon,svg.tf-flow .nd ellipse{fill:var(--surface);stroke:var(--edge);stroke-width:1.8}
svg.tf-flow .nd text{font-family:var(--f-mono);font-weight:700;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg.tf-flow .ed{fill:none;stroke:var(--edge);stroke-width:1.8}
svg.tf-flow .lb{font-family:var(--f-mono);font-weight:800;font-size:11px;fill:var(--muted);text-anchor:middle}
.tf-code{margin:0;background:var(--code-bg,#10182b);color:var(--code-ink,#e6ecfb);font-family:var(--f-mono);font-size:.9rem;line-height:1.7;border-radius:var(--radius);padding:12px 14px;overflow-x:auto;max-width:100%;white-space:pre}
.tf-pyr{display:grid;gap:6px;justify-items:center}
.tf-pyr div{display:flex;gap:6px}
.tf-pc{width:clamp(48px,14vw,66px);height:clamp(40px,10vw,48px);display:grid;place-items:center;border:var(--bw) solid var(--edge);border-radius:8px;background:var(--surface2);font-family:var(--f-mono);font-weight:800;font-size:1.05em}
.tf-pc.q{background:var(--accent2);color:var(--on-accent2)}
.tf-sh{border-collapse:collapse;margin-inline:auto;font-family:var(--f-mono)}
.tf-sh td,.tf-sh th{border:var(--bw-thin) solid var(--line-strong);width:clamp(44px,12vw,60px);height:clamp(44px,12vw,60px);text-align:center;font-weight:800;font-size:1.3em}
.tf-sh th{background:var(--surface2);font-size:1em}
.tf-sh .sum{background:var(--hint-bg)}
.tf-sh .sum.q{background:var(--accent2);color:var(--on-accent2)}

.tf-score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tf-big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3.2rem);line-height:1.05}
.tf-level{display:flex;gap:12px;align-items:center;flex:1;min-width:min(100%,280px)}
.tf-level .mascot{flex:none;width:64px;height:auto}
.tf-level h2{margin-bottom:4px}
.tf-skills{display:grid;gap:12px}
.tf-skill{display:grid;grid-template-columns:minmax(9em,13em) 1fr auto;gap:6px 12px;align-items:center}
.tf-sn{font-weight:800}
.tf-sv{font-weight:700;font-size:.9em;white-space:nowrap}
.tf-meter{display:block;height:16px;border:var(--bw-thin) solid var(--edge);border-radius:999px;background:var(--surface2);overflow:hidden}
.tf-meter i{display:block;height:100%;background:var(--good)}
.tf-skill.mid .tf-meter i{background:var(--accent2)}
.tf-skill.lo .tf-meter i{background:var(--bad)}
@media (max-width:560px){.tf-skill{grid-template-columns:1fr auto}.tf-meter{grid-column:1/-1;order:3}}
.tf-recs{margin:0;padding-left:1.2em;display:grid;gap:10px}
.tf-revs{display:grid;gap:8px}
.tf-rev{border:var(--bw-thin) solid var(--line-strong);border-radius:var(--radius);background:var(--surface)}
.tf-rev>summary{cursor:pointer;display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:center;padding:.6em .8em;min-height:44px;list-style:none}
.tf-rev>summary::-webkit-details-marker{display:none}
.tf-mk{font-weight:800;text-align:center}
.tf-rev.ok .tf-mk{color:var(--good)}.tf-rev.bad .tf-mk{color:var(--bad)}
.tf-rt{font-weight:700;min-width:0}
.tf-rs{font-size:.85em;color:var(--muted);font-weight:700;white-space:nowrap}
.tf-revbody{display:grid;gap:10px;padding:0 .8em .8em}
.tf-text{font-family:var(--f-mono);font-size:.88rem;min-height:9em}
@media (max-width:420px){.tf-rev>summary{grid-template-columns:1.6em 1fr}.tf-rs{grid-column:2}}

/* ===== банк заданий: общие стили ===== */
.badge-cnt{font-weight:800;font-size:.85em;color:var(--good);border:var(--bw-thin) solid var(--good);border-radius:999px;padding:.1em .7em;white-space:nowrap}
.badge-cnt:empty{display:none}
.from{margin-top:-8px}
.choice .btn[disabled]{opacity:.55}

.sub-h{font-family:var(--f-mono);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.io{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}

.io-btns{display:flex;gap:8px;flex-wrap:wrap}

.verd{width:100%}
.verd td,.verd th{font-size:.9em;text-align:left}
.verd pre.plain{margin:0;font-family:inherit;white-space:pre-wrap}
.v-ok{color:var(--good);font-weight:800}.v-bad{color:var(--bad);font-weight:800}
.stage{display:grid;gap:12px}
.play>*{min-width:0}
.gridbox{display:grid;gap:4px;justify-content:center}

.alpha{gap:4px;font-size:.85em}

.tf-lgrid th{font-weight:800;color:var(--muted);padding:2px 6px}

.chestb{display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left}

.cntsvg{width:100%;max-width:300px;height:auto;display:block;margin-inline:auto}

    story: (P) => `<p>Трём друзьям подарили по ${P.th.noun === 'кружка' ? 'кружке' : P.th.noun === 'шапка' ? 'шапке' : P.th.noun === 'шарф' ? 'шарфу' : 'рюкзаку'}: красному, синему и зелёному цвета — у каждого свой цвет.</p><ul class="tf-facts">${P.clues.map(([p, c]) => `<li>У ${P.ppl[p][1]} ${P.th.noun} не ${P.th.adj[c]}${P.th.noun === 'шапка' || P.th.noun === 'кружка' ? '' : ''}.</li>`).join('')}</ul><p>Какого цвета ${P.th.noun} у <b>${P.ppl[P.q][1]}</b>?</p>`.replace(/не (красная|синяя|зелёная|красный|синий|зелёный)/g, (m, a) => 'не ' + a.replace(/ая$/, 'ая').replace(/ый$/, 'ый')),
    draw(play, P, api) {

  });

  /* ============ 5. Шифр сдвига (неделя 3) ============ */
  const ABC = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  const shift = (t, k) => t.split('').map(ch => { const i = ABC.indexOf(ch); return i < 0 ? ch : ABC[(i + k + 33) % 33]; }).join('');
  const CW = ['КОТ', 'СОВА', 'ЛУНА', 'РОБОТ', 'КОД', 'МЫШКА', 'ЭКРАН', 'СЕТЬ', 'ЗАГАДКА', 'ПИКСЕЛЬ', 'ЗВЕЗДА', 'КОСМОС', 'ПАРОЛЬ', 'ИГРА'];
  G.push({
    id: 'cipher', tab: 'Шифр', title: 'Шифр со сдвигом', from: 'неделя 3, задача 1 («Шифр»)',
    make() {

      return { word, k, enc, coded: shift(word, k) };
    },
    story: (P) => {
      const ex = `при сдвиге ${P.k} буква «Я» превращается в «${shift('Я', P.k)}», а «А» — в «${shift('А', P.k)}»`;

        ? `<p>Шифр такой: каждую букву заменяют на букву, которая стоит на <b>${P.k}</b> места(-ов) <b>дальше по алфавиту</b>. Алфавит записан по кругу: после «Я» снова идёт «А» (${ex}).</p><p>Зашифруй слово <b>${P.word}</b>.</p>`
        : `<p>Каждую букву слова заменили на букву, которая стоит на <b>${P.k}</b> места(-ов) <b>дальше по алфавиту</b>. Алфавит записан по кругу: после «Я» снова идёт «А» (${ex}).</p><p>Расшифруй: <b class="mono">${P.coded}</b></p>`;
    },
    draw(play, P, api) {
      play.append(h('div', { class: 'tf-nums alpha', role: 'img', 'aria-label': 'Алфавит: ' + ABC }, ABC.split('').map(x => h('span', { class: 'tf-n' }, x))));

        if (v.trim().length !== want.length) return api.bad(`В слове ${want.length} букв, а у тебя ${v.trim().length}.`);

      };
      play.append(checkRow(inp, chk));
    },
    hints: (P) => [P.enc ? 'Для каждой буквы отсчитай нужное число букв вперёд по алфавиту.' : 'Чтобы расшифровать, делай обратное: иди по алфавиту назад.', 'Выпиши буквы под алфавитом и считай клетки пальцем.', 'Если дошёл до конца алфавита (Я), продолжай с А.'],
    explain: (P) => `<p>Слово <b>${P.word}</b> ↔ <b>${P.coded}</b>. Каждая буква сдвигается на ${P.k} вперёд при шифровании и на ${P.k} назад при расшифровке.</p>`
  });

  /* ============ 6. Кто виноват (истина или ложь) ============ */
  const DEEDS = ['разбил вазу', 'съел конфету', 'потерял мяч', 'нарисовал на стене', 'сломал карандаш'];
  G.push({
    id: 'liar', tab: 'Правда или ложь', title: 'Кто сказал правду?', from: 'методичка («Истина или ложь») и неделя 2, задача 3',
    make() {

  /* ============ 7. Сундуки (сортировка и группировка) ============ */
  const COL = [['красный', 'красные', '#D8402F'], ['синий', 'синие', '#2F6BFF'], ['зелёный', 'зелёные', '#1C9B5A'], ['жёлтый', 'жёлтые', '#E8B010']];
  const SHP = [['шар', 'шары', '●'], ['куб', 'кубы', '■'], ['звезда', 'звёзды', '★']];
  G.push({

        const yes = items.map((x, i) => test(x) ? i : -1).filter(i => i >= 0);
        if (yes.length >= 2 && yes.length <= 5) {
          const text = { c: COL[ci][1], s: SHP[si][1], and: COL[ci][1] + ' ' + SHP[si][1], or: `${COL[ci][1]} предметы и ${SHP[si][1]} любого цвета`, notc: `все предметы, кроме ${COL[ci][1]}` }[kind];
          return { items, kind, text, yes };
        }
      }
      return { items: [{ c: 0, s: 0 }, { c: 0, s: 1 }, { c: 1, s: 0 }], kind: 'c', text: 'красные', yes: [0, 1] };
    },
    story: (P) => `<p>В волшебный сундук кладут только <b>${P.text}</b>. Нажми на предметы, которые подойдут, и проверь.</p>`,
    draw(play, P, api) {

      const btns = P.items.map((x, i) => h('button', { class: 'btn chestb', type: 'button', 'aria-pressed': 'false', onclick: () => { if (sel.has(i)) sel.delete(i); else sel.add(i); btns[i].setAttribute('aria-pressed', sel.has(i) ? 'true' : 'false'); } },

      };

    hints: (P) => ['Читай каждый предмет вслух: подходит он под правило или нет?', P.kind === 'or' ? 'Слово «или» значит: достаточно ОДНОГО из условий.' : P.kind === 'and' ? 'Нужны ОБА признака сразу: и цвет, и форма.' : P.kind === 'notc' ? 'Подходят все, у кого цвет другой.' : 'Смотри только на тот признак, который назван в правиле.', `Всего подходит ${P.yes.length} предмета(-ов).`],
    explain: (P) => `<p>Подходят: ${P.yes.map(i => COL[P.items[i].c][0] + ' ' + SHP[P.items[i].s][0]).join(', ')}.</p>`
  });

  /* ============ 8. Сколько фигур (подсчёт) ============ */
  function squaresIn(a, b) { let t = 0; for (let k = 1; k <= Math.min(a, b); k++) t += (a - k + 1) * (b - k + 1); return t; }
  G.push({
    id: 'count', tab: 'Сколько фигур', title: 'Посчитай фигуры', from: 'методичка («Подсчёт и комбинаторика»)',
    make() {
      if (Math.random() < 0.5) { const a = rnd(2, 4), b = Math.random() < 0.5 ? a : rnd(2, 4); return { kind: 'sq', a, b, ans: squaresIn(a, b) }; }
      const n = rnd(2, 4); return { kind: 'tri', n, ans: (n + 1) * (n + 2) / 2 };
    },
    story: (P) => P.kind === 'sq' ? `<p>На рисунке — сетка ${P.a}×${P.b} клеток. Сколько <b>всего квадратов</b> на ней? Считай и маленькие, и большие, составленные из нескольких клеток.</p>` : `<p>Из верхней вершины большого треугольника до основания проведено ${P.n} ${P.n === 1 ? 'отрезок' : P.n < 5 ? 'отрезка' : 'отрезков'}. Сколько <b>всего треугольников</b> на рисунке?</p>`,

    explain: (P) => {

  });

  /* ============ 9. Устройства (недели 1 и 3) ============ */
  const DEV = {

  });

  /* ============ 10. Кибербезопасность (методичка) ============ */
